---
# ============================================
# RustFS - S3-compatible object storage
# https://docs.rustfs.com/
# ============================================
# Single Node, Single Disk (SNSD). One volume, therefore no erasure coding:
# losing the data device loses the data. The durability story is the array
# under the `sas` datastore plus the PVE backup on that disk - see the reasoning
# in live/opentofu/proxmox/petruk-pve/petruk-pve0/vms/rustfs/terragrunt.hcl.

# --------------------------------------------
# Version
# --------------------------------------------
# https://github.com/rustfs/rustfs/releases
#
# 1.0.0 went GA in 2026-09; before that every release was a prerelease. There
# is still no documented in-place downgrade, so treat a version bump as a change
# that wants .rustfs.sys (IAM, bucket metadata) and the old binary backed up
# first, not as a routine patch. beta.11 -> 1.0.6 was a direct jump: no upgrade
# notes apply to a single node (1.0.5's are about mixed-version pools).
rustfs_version: "1.0.6"

# The upstream one-liner (`curl -O https://rustfs.com/install_rustfs.sh`) is
# NOT used, for two reasons that are not stylistic:
#
#   1. It is interactive - it `read`s the service port, console port and data
#     directory from a TTY. There is no non-interactive flag. Piping answers in
#     would be a fragile way to reproduce what the tasks below do declaratively.
#   2. It downloads `...-latest.zip`, so the installed version is whenever you
#      happened to run it. That is the opposite of what this repo is for.
#
# What tasks/install.yaml does instead is exactly what that script does - drop
# the binary at /usr/local/bin/rustfs, write /etc/default/rustfs, write
# /etc/systemd/system/rustfs.service - from a pinned, checksummed artifact.
#
# `gnu` rather than `musl`: the installer picks GNU whenever glibc >= 2.31, and
# Ubuntu 24.04 ships 2.39. tasks/preflight.yaml asserts that rather than
# assuming it.
rustfs_download_base: https://github.com/rustfs/rustfs/releases/download
rustfs_libc: gnu
rustfs_package_name: "rustfs-linux-{{ ansible_facts['architecture'] }}-{{ rustfs_libc }}-v{{ rustfs_version }}.zip"
rustfs_package_url: "{{ rustfs_download_base }}/{{ rustfs_version }}/{{ rustfs_package_name }}"

# From the SHA256SUMS asset published alongside the release. Verified by
# ansible.builtin.get_url, so a corrupted or substituted artifact fails the
# download task rather than becoming the running binary.
#
# Refresh on a version bump with:
#   curl -fsSL https://github.com/rustfs/rustfs/releases/download/<version>/SHA256SUMS
rustfs_package_sha256: 4f0bf3fecbe861467427ff506aee22c302cfd5ac8b7dcbde71714f8e5e680dea

rustfs_binary_path: /usr/local/bin/rustfs
# Records which version the binary at rustfs_binary_path was laid down from, so
# a steady-state run neither re-downloads nor restarts the service. Same idea as
# harbor_version_marker.
rustfs_version_marker: /etc/rustfs-installed-version

# --------------------------------------------
# Identity
# --------------------------------------------
# Three names, and they are not interchangeable. All vaulted - the tree is
# public, and a resolvable name is the first half of a reachable service. See
# live/ansible/README.md.
#
#   vault_rustfs_s3_host       - the S3 endpoint every client signs against.
#                                An Unbound ALIAS onto the 1Panel host.
#   vault_rustfs_console_host  - the web console. Also an alias.
#   vault_rustfs_guest_host    - an A record for the guest itself, for SSH,
#                                Ansible and the 1Panel upstream.
#
# The S3 API and the console MUST be separate hostnames rather than paths on
# one. S3 clients sign the request path (SigV4); serving the API under, say,
# /s3/ makes RustFS read `s3` as the bucket name and every request fails
# signature validation. https://docs.rustfs.com/integration/nginx
rustfs_s3_host: "{{ vault_rustfs_s3_host }}"
rustfs_console_host: "{{ vault_rustfs_console_host }}"
rustfs_s3_endpoint: "https://{{ rustfs_s3_host }}"
rustfs_console_url: "https://{{ rustfs_console_host }}"

# --------------------------------------------
# Listeners
# --------------------------------------------
# Bound on all interfaces because OpenResty on the 1Panel VM (10.10.99.10) is
# the client, not the loopback. TLS is terminated there with the Let's Encrypt
# wildcard, so RustFS itself speaks plain HTTP on the LAN - the same shape as
# Harbor. Setting RUSTFS_TLS_PATH here instead would mean a second copy of the
# certificate to renew for no gain.
rustfs_address: ":9000"
rustfs_console_address: ":9001"
rustfs_console_enable: true

# --------------------------------------------
# Data volume
# --------------------------------------------
# Dedicated block device, addressed by disk serial (set in the OpenTofu unit)
# rather than /dev/sdb, which is not stable across reboots. Note the "S" prefix:
# QEMU exposes a user-set serial as scsi-SQEMU_QEMU_HARDDISK_<serial>.
rustfs_data_device: /dev/disk/by-id/scsi-SQEMU_QEMU_HARDDISK_rustfs-data0
rustfs_data_mount: /data/rustfs0

# XFS, not ext4, and this one is upstream's word rather than a preference:
# "RustFS strongly recommends formatting all storage disks with the XFS file
# system." The mkfs options come from the same page - `-i size=512` gives room
# for inline extended attributes (RustFS stores object metadata in xattrs) and
# `-n ftype=1` is required for the d_type support the storage layer expects.
rustfs_data_filesystem: xfs
rustfs_data_fs_label: RUSTFS0
rustfs_data_mkfs_opts: "-i size=512 -n ftype=1 -L {{ rustfs_data_fs_label }}"
# noatime/nodiratime: an object store touches enormous numbers of files and has
# no use for access timestamps. Straight from upstream's fstab example.
# nofail so a missing or renamed disk degrades to "RustFS will not start" rather
# than "the guest drops to an emergency shell on boot".
rustfs_data_mount_opts: "defaults,noatime,nodiratime,nofail"

# RUSTFS_VOLUMES. A single path here is what makes this SNSD. Going multi-disk
# means attaching more devices, mounting them at /data/rustfs1..N and setting
# this to the ellipsis form "/data/rustfs{0...3}" - and wiping /data, because
# the erasure layout is written at first format and is not migratable in place.
rustfs_volumes: "{{ rustfs_data_mount }}"

# --------------------------------------------
# Credentials
# --------------------------------------------
# RustFS boots with rustfsadmin/rustfsadmin if these are unset. Unlike Harbor's
# admin password these are NOT first-boot-only - they are read from the
# environment on every start, so rotating them is: edit the vault, re-run,
# service restarts, done. Update anything holding the old key at the same time.
rustfs_access_key: "{{ vault_rustfs_access_key }}"
rustfs_secret_key: "{{ vault_rustfs_secret_key }}"

# --------------------------------------------
# S3 semantics
# --------------------------------------------
# Clients that require a region and are given none tend to guess differently
# from each other; pinning it makes the SigV4 credential scope predictable.
rustfs_region: us-east-1

# RUSTFS_SERVER_DOMAINS is deliberately NOT set, so only path-style addressing
# works: https://<s3-host>/<bucket>/<key>, not https://<bucket>.<s3-host>/<key>.
#
# The blocker is the certificate, not RustFS. The wildcard OPNsense renews
# matches exactly one label - so `<bucket>.<s3-host>` is two levels deep and
# does NOT verify. Enabling virtual-host style would need a wildcard one level
# deeper issued and pushed into 1Panel, plus a matching DNS wildcard in Unbound.
#
# Practical consequence: SDKs must be configured for path style -
# `--endpoint-url` plus `AWS_S3_FORCE_PATH_STYLE`/`force_path_style: true`.
rustfs_server_domains: ""

# --------------------------------------------
# Logging
# --------------------------------------------
# /var/log/rustfs, not the /var/logs/rustfs the docs page shows in one place -
# the upstream installer uses /var/log/rustfs and it is the FHS path.
rustfs_log_directory: /var/log/rustfs
rustfs_log_level: info
# Defaults are hourly rotation, 30 files kept, 2 GiB total budget. Left alone;
# the root disk is 40 GiB and the budget is enforced by RustFS itself.

# --------------------------------------------
# Health
# --------------------------------------------
# RUSTFS_HEALTH_ENDPOINT_ENABLE defaults to true and serves /health and
# /health/ready unauthenticated on the S3 listener. tasks/install.yaml waits on
# the readiness probe rather than on `systemctl is-active`, because systemd
# reports the unit active as soon as the notify handshake lands - which is
# before the volume has been scanned.
rustfs_health_url: "http://127.0.0.1{{ rustfs_address }}/health/ready"
rustfs_ready_retries: 30
rustfs_ready_delay: 5

# --------------------------------------------
# System dependencies
# --------------------------------------------
# unzip: the release artifact is a .zip.
# xfsprogs: mkfs.xfs and xfs_growfs.
rustfs_packages:
  - ca-certificates
  - curl
  - unzip
  - xfsprogs

# ============================================
# IAM - policies and users (manage-iam.yaml)
# ============================================
# Everything below is read by manage-iam.yaml only; install-rustfs.yaml does not
# touch it.
#
# `rc` is RustFS's own client (https://github.com/rustfs/cli). MinIO's `mc`
# is not used: its admin calls were rejected by RustFS for a long time and rc's
# README is explicit that the two admin APIs are not interchangeable.
#
# The default linux artifacts are static musl builds, so unlike the server
# there is no glibc question to assert on.
#
# Checksums are from the release's SHA256SUMS. Refresh both on a bump:
#   curl -fsSL https://github.com/rustfs/cli/releases/download/v<version>/SHA256SUMS
rustfs_cli_version: "0.1.38"
rustfs_cli_arch_map:
  x86_64: amd64
  aarch64: arm64
rustfs_cli_arch: "{{ rustfs_cli_arch_map[ansible_facts['architecture']] }}"
rustfs_cli_package_name: "rustfs-cli-linux-{{ rustfs_cli_arch }}-v{{ rustfs_cli_version }}.tar.gz"
rustfs_cli_package_url: "https://github.com/rustfs/cli/releases/download/v{{ rustfs_cli_version }}/{{ rustfs_cli_package_name }}"
rustfs_cli_package_sha256:
  amd64: 9741028f46f5f5a152da1e3257980e9c7be2714c21b5b14a8bb5ac7d93f882e9
  arm64: 3b4c38698174ff13844bf4a824230cb2e26930712ac3fb149dcd460934c6367c
rustfs_cli_binary_path: /usr/local/bin/rc

# rc resolves an alias from RC_HOST_<alias> when that variable is set, so the
# root credentials reach it through the task environment and are never written
# to ~/.config/rc/config.toml on the guest.
#
# Loopback and plain http on purpose: this runs ON the RustFS guest, so there is
# no wire to encrypt and no dependency on the 1Panel website being up.
#
# The credentials sit in the URL's userinfo, so they are percent-encoded - and
# `/` is encoded by hand because Jinja's urlencode leaves it alone, and a bare
# `/` there ends the authority.
rustfs_cli_alias: rustfs
rustfs_cli_env:
  RC_HOST_rustfs: >-
    http://{{ rustfs_access_key | urlencode | replace('/', '%2F')
    }}:{{ rustfs_secret_key | urlencode | replace('/', '%2F')
    }}@127.0.0.1{{ rustfs_address }}

# Policies. `document` is uploaded as-is; a policy whose stored document differs
# from this one is overwritten, so this list is the source of truth for every
# name in it. Policies not listed here are left alone.
rustfs_policies:
  # Everything github-actions-cache-server does to its one bucket: HeadBucket
  # at startup, object get/put/delete, multipart uploads, and listing for the
  # storage budget. Nothing outside the bucket.
  - name: gha-cache-rw
    document:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Action:
            - s3:ListBucket
            - s3:GetBucketLocation
            - s3:ListBucketMultipartUploads
          Resource:
            - arn:aws:s3:::gha-cache
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:AbortMultipartUpload
            - s3:ListMultipartUploadParts
          Resource:
            - arn:aws:s3:::gha-cache/*
  # What a CI job needs to store an artifact in gha-artifacts and read it back:
  # put (multipart included), get, list. NO s3:DeleteObject - nothing in CI
  # removes an artifact, the lifecycle rule below does, so a leaked key can add
  # to the bucket but cannot empty it. Nothing outside the bucket.
  - name: gha-artifacts-rw
    document:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Action:
            - s3:ListBucket
            - s3:GetBucketLocation
            - s3:ListBucketMultipartUploads
          Resource:
            - arn:aws:s3:::gha-artifacts
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:AbortMultipartUpload
            - s3:ListMultipartUploadParts
          Resource:
            - arn:aws:s3:::gha-artifacts/*

# Users. In RustFS a user IS a key pair: `access_key` is the username and
# `secret_key` its secret, and that pair is what the consumer signs with.
#
# CREATE-ONLY for the secret, same as 1panel/manage-databases.yaml: an existing
# user's secret is never rewritten from here, because doing so would cut off a
# consumer that is still running with the old one. Policies ARE reconciled
# (missing ones are attached; extra ones are left alone).
#
# The pair lives in the CONSUMER's vault, not in this playbook's - a secret in
# two files is a secret that can disagree.
#
# ROTATION is a new user, not a new secret, so both keys work while the
# consumer is switched over:
#   1. change the access key AND secret in the consumer's vault
#   2. run manage-iam.yaml          - creates the new user, old one untouched
#   3. redeploy the consumer
#   4. add the OLD access key to rustfs_users_absent, run manage-iam.yaml again
rustfs_users:
  - access_key: "{{ vault_gha_cache_s3_access_key | default('') }}"
    secret_key: "{{ vault_gha_cache_s3_secret_key | default('') }}"
    policies:
      - gha-cache-rw
  # The CI artifact uploader (oprek-sh/garwa-app's upload-to-rustfs.sh today).
  # Its consumer is a pair of GitHub Actions secrets, RUSTFS_ACCESS_KEY_ID and
  # RUSTFS_SECRET_ACCESS_KEY, and has no vault in this repository - so the pair
  # is kept in vars/vault.yaml here, and the secrets are set from it.
  - access_key: "{{ vault_gha_artifacts_s3_access_key | default('') }}"
    secret_key: "{{ vault_gha_artifacts_s3_secret_key | default('') }}"
    policies:
      - gha-artifacts-rw

# Access keys (usernames) that must not exist. Removal is immediate and takes
# the user's access with it - only list a key once nothing signs with it.
rustfs_users_absent: []

# ============================================
# Bucket lifecycle (manage-lifecycle.yaml)
# ============================================
# One entry per bucket; `rules` is the bucket's WHOLE lifecycle configuration,
# imported with `rc ilm rule import` when it differs from what
# `rc ilm rule export` returns. A rule added by hand in the console is therefore
# removed on the next run. Buckets not listed here are left alone, and a listed
# bucket that does not exist fails the play - buckets are still created by hand
# (README, "Creating buckets").
#
# The rules follow what each bucket is FOR, which is why they differ:
rustfs_bucket_lifecycles:
  # gha-cache is an index's backing store, not a pile of files. The cache
  # server keeps every object in its Postgres database and evicts by its own
  # rules (gha_cache_max_size_bytes, gha_cache_cleanup_older_than_days in
  # ../gha-cache/vars/main.yaml). An expiry rule here would delete objects the
  # database still lists, and a cache hit would become a failed restore. So NO
  # expiration - only the one thing the server cannot clean up: multipart
  # uploads abandoned by a job that died mid-save, which it has no row for.
  # Three days, to stay clear of any upload a long job still has open.
  - bucket: gha-cache
    rules:
      - id: abort-incomplete-multipart
        status: Enabled
        abortIncompleteMultipartUploadDays: 3
  # gha-artifacts is the opposite: write-once files nobody indexes (a junit
  # file from a failed shard, an SBOM per security run), read while a failure
  # is being looked at and never again. Nothing else deletes them - the
  # uploader's policy cannot - so expiry is the only bound on the bucket.
  # 30 days against the 3 that GitHub's own artifact storage gives this org.
  - bucket: gha-artifacts
    rules:
      - id: expire-artifacts
        status: Enabled
        expiration:
          days: 30
      - id: abort-incomplete-multipart
        status: Enabled
        abortIncompleteMultipartUploadDays: 1
