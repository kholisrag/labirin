---
- name: Install Fireactions
  hosts: fireactions_all
  become: true

  # ONE HOST AT A TIME, AND A BATCH OF ONE CANNOT PARTIALLY FAIL.
  #
  # There are FOUR hosts here, not two - fireactions_vm_01 through _04 - so a
  # roll is a four-step operation and every one of them is a live CI runner for
  # the platform organisation. Without `serial` Ansible applies to all four at
  # once and a bad commit takes the whole fleet before anyone reads the first
  # failure.
  #
  # max_fail_percentage is what makes serial mean anything: with a batch size of
  # one, any failure is 100% of the batch, which is above 0, so the play stops
  # rather than moving on to host 2. Ansible's default would continue with the
  # remaining hosts and report a failure at the end - which is the same
  # end state as having no serial at all.
  #
  # ON THE PLAY, NOT ON THE SEMAPHORE TEMPLATE, and that placement is the point:
  # a run from an operator's laptop gets the identical protection. The safety
  # belongs to the play, not to whatever invoked it. ADR-0119 §D.
  #
  # What gates host 2 is the "Assert Fireactions is running" task at the end of
  # tasks/fireactions.yaml - the play's own existing health definition, not a
  # new one. It proves the host is HEALTHY and never that it is on the NEW
  # configuration; a silent no-op looks identical to a clean apply. Semaphore's
  # task history is where that distinction lives. ADR-0119 §D, ADR-0123 §E.
  serial: 1
  max_fail_percentage: 0

  vars_files:
    - vars/main.yaml
    - vars/vault.yaml
    # The GitHub org the pools register against, shared with cantrik-ci and
    # athens rather than copied into each vault.
    - ../../vars/github-identity.yaml
    # fireactions_registry_mirror is Harbor's registry host, read from its
    # owner's vault so the two cannot drift.
    - ../harbor/vars/vault.yaml

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted
        daemon_reload: true

    # Skipped on a first run: handlers are flushed once after Containerd, at
    # which point the Fireactions unit does not exist yet. The service is
    # started explicitly at the end of tasks/fireactions.yaml instead.
    - name: Restart fireactions
      ansible.builtin.systemd_service:
        name: fireactions
        state: restarted
        daemon_reload: true
      when: fireactions_service_unit_exists | default(false) | bool

  tasks:
    # ============================================
    # Pre-flight checks
    # ============================================
    - name: Run pre-flight checks
      ansible.builtin.include_tasks:
        file: tasks/preflight.yaml
      tags:
        - always

    # ============================================
    # Components
    # ============================================
    - name: Install system dependencies
      ansible.builtin.include_tasks:
        file: tasks/dependencies.yaml
      tags:
        - dependencies

    - name: Install Firecracker
      ansible.builtin.include_tasks:
        file: tasks/firecracker.yaml
      tags:
        - firecracker

    - name: Install Containerd
      ansible.builtin.include_tasks:
        file: tasks/containerd.yaml
      tags:
        - containerd

    - name: Install CNI plugins
      ansible.builtin.include_tasks:
        file: tasks/cni.yaml
      tags:
        - cni

    - name: Install Firecracker guest kernel
      ansible.builtin.include_tasks:
        file: tasks/kernel.yaml
      tags:
        - kernel

    - name: Install Fireactions
      ansible.builtin.include_tasks:
        file: tasks/fireactions.yaml
      tags:
        - fireactions

    # ============================================
    # Summary
    # ============================================
    - name: Display post-install instructions
      ansible.builtin.debug:
        msg:
          - "========================================"
          - "Fireactions {{ fireactions_version }} installed on {{ inventory_hostname }}"
          - "========================================"
          - ""
          - "Pools    : {{ fireactions_pools | map(attribute='name') | join(', ') }}"
          - "Replicas : {{ fireactions_pools | map(attribute='replicas') | sum }} standing microVMs (see the README for the memory budget)"
          - ""
          - "Verify with:"
          - "  systemctl status fireactions"
          - "  journalctl -u fireactions -f"
          - "  fireactions pools ls"
          - ""
          - "Runners should show as Idle at:"
          - "  https://github.com/organizations/{{ fireactions_github_organization }}/settings/actions/runners"
          - ""
      tags:
        - always
