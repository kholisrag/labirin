---
# ============================================
# Monitoring - Prometheus + Grafana
# ============================================
# One Compose stack, two services, created through 1Panel's own API rather than
# over SSH - the same shape as ../athens and ../gha-cache. A stack created with
# `from: edit` shows up in Containers > Compose exactly like one made in the
# dashboard, so the panel stays the single place where the box's containers are
# listed, logged and restarted.
#
# ONE STACK AND NOT TWO, ON PURPOSE. Grafana has to reach Prometheus, and the
# only cheap way to do that is a shared Compose network where `prometheus` is a
# resolvable name. Split into two stacks they land on different bridge networks
# and Grafana's datasource has to go out to the host and back in through
# `host.docker.internal` - a second path to keep working for no gain. The
# loopback publishes below exist for the reverse proxy, not for Grafana.
#
# Consequence worth knowing: 1Panel decides where the files live. `from: edit`
# writes to {DataDir}/docker/compose/{name}/docker-compose.yml and a sibling
# .env - see loadPath()/newComposeEnv() in agent/app/service/container_compose.go.
# The paths below mirror that decision; they are not free choices.

monitoring_compose_name: monitoring

# {DataDir} is /opt/1panel on this install.
monitoring_compose_dir: /opt/1panel/docker/compose/{{ monitoring_compose_name }}
monitoring_compose_file: "{{ monitoring_compose_dir }}/docker-compose.yml"

# Loopback ONLY, for both services. OpenResty on this box runs with
# `network_mode: host` (see its docker-compose.yml), so 127.0.0.1 from nginx
# *is* the host's loopback and the reverse proxy reaches these fine. Anything
# else on the LAN cannot, which is the point: the only way in is the TLS
# website, and there is no second plaintext door on 10.10.99.10.
monitoring_bind_address: 127.0.0.1

# ============================================
# Prometheus
# ============================================
# Pinned rather than floating on :latest - a TSDB is the one component here
# where an unattended major bump is expensive. v3.13.1 is the current stable
# (released 2026-07-10); check https://github.com/prometheus/prometheus/releases
# before moving it.
monitoring_prometheus_version: v3.13.1

monitoring_prometheus_container: prometheus

# 9090 is Prometheus' own default and it is free on this box - unlike Athens,
# which had to move off 3000 because Gitea was already there. The preflight in
# install-monitoring.yaml fails the run if that ever stops being true.
monitoring_prometheus_port: 9090

# The image runs as `nobody` and chowns /prometheus to it at build time (see
# the upstream Dockerfile). A bind mount ignores that, so install-monitoring.yaml
# chowns the host directory to the same numeric id before the stack comes up.
monitoring_prometheus_uid: 65534
monitoring_prometheus_gid: 65534

monitoring_prometheus_dir: "{{ monitoring_compose_dir }}/prometheus"
monitoring_prometheus_config: "{{ monitoring_prometheus_dir }}/prometheus.yml"
monitoring_prometheus_data_dir: "{{ monitoring_prometheus_dir }}/data"

# BOTH bounds, because either one alone lets the other run away. The time bound
# is what you reason about ("a quarter of history"); the size bound is what
# stops a scrape-target explosion filling the 1Panel guest's 50 GiB root disk,
# which is shared with every other app on the box.
monitoring_prometheus_retention_time: 90d
monitoring_prometheus_retention_size: 20GB

# How often every target below is scraped, and how often rules are evaluated.
# 15s is the upstream default and is far finer than anything here needs; it is
# left alone because the cost is trivial at this target count and lowering it
# is the kind of change that quietly hides a short outage.
monitoring_prometheus_scrape_interval: 15s
monitoring_prometheus_evaluation_interval: 15s

# ============================================
# Cross-stack scraping
# ============================================
# 1Panel's own user-defined bridge, joined as an EXTERNAL network, exactly as
# ../gha-cache does and for the same reason: it is the only way one stack on
# this box can address another by name.
#
# THE OBVIOUS ALTERNATIVE DOES NOT WORK, and it is worth writing down because
# it is the first thing anyone will reach for. Every other stack on this guest
# publishes on 127.0.0.1 only (gha-cache on 3400, Athens on 3300, and this one
# on 9090/3500). A container's 127.0.0.1 is its OWN loopback, and an
# `extra_hosts` host-gateway mapping resolves to the bridge gateway address -
# which a port bound to the host's loopback does not answer on. So there is no
# route from this stack to a neighbouring one over the host at all; the shared
# bridge is not an optimisation, it is the only door.
#
# What it costs, stated rather than buried: Prometheus becomes reachable from
# everything else on that bridge, and Prometheus has no authentication (see the
# section on that in the README). It is bounded by the two flags the compose
# template deliberately does not set - without --web.enable-lifecycle and
# --web.enable-admin-api there is no shutdown and no delete-series API to
# reach - so what a neighbouring container gains is the ability to read
# metrics, which every one of them already exposes to this Prometheus anyway.
# Grafana deliberately does NOT join: it talks only to Prometheus, over this
# stack's own network, and putting it here would widen the exposure of the one
# service on the box that holds credentials.
monitoring_scrape_network: 1panel-network

# Containers named in monitoring_scrape_configs that belong to ANOTHER stack.
# install-monitoring.yaml asserts each of these exists on the guest before it
# writes anything.
#
# THIS IS THE POINT OF THE LIST. A cross-stack target is a container name
# written here and defined somewhere else - gha-cache's is
# gha_cache_container_name in ../gha-cache/vars/main.yaml - and the two can
# drift with nothing linking them. Without the assert that drift presents as a
# target permanently `down` in a UI nobody has open, which is the same
# green-and-wrong shape the ../1panel/vars/main.yaml port comment warns about.
monitoring_required_containers:
  - gha-cache

# ============================================
# node_exporter on the Fireactions hosts
# ============================================
# WHAT THIS IS FOR, because it decides what may be trimmed out of it later.
# Guests on the Fireactions pool have been seen going quiet on the network while
# still running - transmitting at a fraction of what they receive, and on two
# occasions transmitting nothing at all for ten minutes until the job they were
# running was declared lost. The candidates left standing are all host-side and
# all on the transmit path: the tap/veth pair, offload (GSO/TSO/GRO) on the tap
# or on the uplink, and a path-MTU problem that only bites full-size segments.
#
# Two of those three fail by BLACK-HOLING rather than by slowing, and both show
# up the same way - as transmit errors, drops or carrier losses on an interface
# of the host. Nothing on this estate exports those counters today, so every
# event so far has been read from GitHub's side, where a mute guest and a dead
# guest look identical. This is the instrument that tells them apart, and it is
# useless retroactively: it has to be standing before the next event.
#
# THE FOUR HOSTS ARE NOT NAMED HERE AT ALL. install-monitoring.yaml's first play
# applies to the same inventory group install-fireactions.yaml does, and derives
# the scrape targets from its own host list on the way out - so a fifth host is
# added to the inventory and to nowhere else. A list in this file would be the
# drift that monitoring_required_containers further up exists to catch, with no
# equivalent check available for it.

# Pinned, like Prometheus and Grafana above. v1.12.1 is the current stable
# (released 2026-07-14); check
# https://github.com/prometheus/node_exporter/releases before moving it.
monitoring_node_exporter_version: "1.12.1"

# 9100 is node_exporter's own default and nothing on those hosts claims it -
# Fireactions itself is on 8081 and Containerd has no TCP listener at all.
monitoring_node_exporter_port: 9100

monitoring_node_exporter_bin_dir: /usr/local/bin
monitoring_node_exporter_bin: "{{ monitoring_node_exporter_bin_dir }}/node_exporter"
monitoring_node_exporter_unit: /etc/systemd/system/node_exporter.service

# A system account with no shell and no home. node_exporter needs none of root's
# privileges for the counters this exists to collect - netdev and netclass both
# read /proc and /sys, which are world-readable - and the unit is written with
# NoNewPrivileges and a read-only filesystem on top of that. Collectors that DO
# want root are the ones nobody here reads.
monitoring_node_exporter_user: node_exporter

# {{ monitoring_node_exporter_arch }} is set as a fact by the play, from the
# host's own architecture: this release names its assets Go-style (amd64/arm64),
# where Firecracker's next door use `uname -m`.
monitoring_node_exporter_release_base_url: >-
  https://github.com/prometheus/node_exporter/releases/download/v{{ monitoring_node_exporter_version }}
monitoring_node_exporter_url: >-
  {{ monitoring_node_exporter_release_base_url }}/node_exporter-{{ monitoring_node_exporter_version }}.linux-{{ monitoring_node_exporter_arch }}.tar.gz
monitoring_node_exporter_checksums_url: >-
  {{ monitoring_node_exporter_release_base_url }}/sha256sums.txt

# monitoring_node_exporter_targets is `<ansible_host>:9100` per host and is set
# as a fact by the first play, not defined here - see the comment on that task.
#
# THOSE ARE NAMES AND NOT ADDRESSES, which is the opposite of what the note in
# the scrape section below asks for, and the reason is that the addresses are
# not knowable from here. The Fireactions hosts are the one group in this tree
# with no IP recorded anywhere - the inventory carries A records
# (unbound_hosts in ../opnsense/vars/vault.yaml) precisely so that it resolves
# from somewhere other than one laptop, and hard-coding four addresses to satisfy
# the preference would put the host list in a second place and make it wrong the
# first time a reservation moves.
#
# What it costs, stated rather than buried: these four targets go down when
# Unbound does. A scrape failure is visible as `up == 0`, which is forwarded,
# so that failure is loud rather than silent - and Unbound being down is not a
# state in which the rest of this estate is fine.

# ============================================
# Scrape targets
# ============================================
# Four jobs: this stack's own two, the Actions cache server next door, and
# node_exporter on the Fireactions hosts. Everything else on the estate is still
# unscraped, and that is still the honest state of it - node_exporter on the PVE
# hosts and cAdvisor for this box's containers do not exist yet, and each is its
# own playbook and its own firewall decision rather than a line in this list.
#
# Adding one once the exporter exists is a single entry here plus a re-run.
# `scheme` and `metrics_path` default to http and /metrics; give an entry on
# ANOTHER GUEST the guest's IP rather than its name, for the same reason
# ../1panel/vars/main.yaml uses addresses in `upstream` - these are static DHCP
# reservations keyed on the VM's MAC, so they are as stable as the name and do
# not make Prometheus depend on Unbound being up. The `node` job below is the
# documented exception and says why it is one.
#
#   - job_name: pve
#     targets:
#       - 10.10.99.13:9100
#       - 10.10.99.14:9100
#
# NOTE THE FIRST THREE NAMES BELOW ARE CONTAINER NAMES, NOT HOSTS, and every one
# of them is resolved by Docker's embedded DNS rather than by Unbound. The first
# two sit on this stack's own Compose network; the third sits on
# monitoring_scrape_network above, which is why Prometheus joins it. `localhost`
# would be Prometheus' own container in the first job and would be wrong in the
# other two.
#
# THE PORT IS THE CONTAINER'S, NOT THE PUBLISHED ONE. gha-cache is published on
# the host as 127.0.0.1:3400, but that mapping does not exist on the bridge -
# over the network the container is reached on the 3000 it actually listens on.
# Using 3400 here fails in the way that is hardest to spot: a connection refused
# every 15 seconds, reported nowhere but the target page.
monitoring_scrape_configs:
  - job_name: prometheus
    targets:
      - "{{ monitoring_prometheus_container }}:9090"

  - job_name: grafana
    targets:
      - "{{ monitoring_grafana_container }}:3000"

  # github-actions-cache-server. /metrics is served unauthenticated and needs
  # NOTHING opened to be scraped - it is reached over the shared bridge, not
  # through the TLS website, so the WAF and the token check in front of the API
  # are untouched. That is deliberate and is the constraint this job was written
  # under: ../gha-cache/vars/main.yaml records why SKIP_TOKEN_VALIDATION is the
  # one variable that must never be set, and a scrape config is a read of
  # /metrics, not a reason to loosen anything in front of the API.
  #
  # It exports cache_requests_total{result}, cache_uploads_total and
  # cache_storage_bytes alongside the stock Node process and event-loop set -
  # 134 series in total, of which the first three are the ones anything reads.
  - job_name: gha-cache
    targets:
      - "gha-cache:3000"

  # The Fireactions hosts. Reached over the LAN rather than over a bridge - this
  # is the first job here whose targets are not on this box at all - and the
  # exporter is installed by the first play of install-monitoring.yaml, so the
  # thing that scrapes and the thing that installs cannot get out of step.
  #
  # An undefined fact here means the playbook was run without the Fireactions
  # inventory; the second play asserts on that rather than rendering a job with
  # no targets, which would sit in Prometheus looking configured and collect
  # nothing.
  - job_name: node
    targets: "{{ monitoring_node_exporter_targets }}"

# ============================================
# Remote write - Grafana Cloud
# ============================================
# Prometheus scrapes locally and forwards a SUBSET onward to a hosted stack, so
# the estate can be alerted on from somewhere that is not the estate. Nothing
# here changes what is scraped or what is kept locally: remote write is a copy
# of samples as they are ingested, and the 90d/20GB TSDB above is unaffected.
#
# WHY FORWARD AT ALL, given there is a Grafana on this box already. Because the
# local one is on the same guest as everything it watches, behind the same
# OpenResty, on the same disk. It is the right place to look at metrics and the
# wrong place to be told about them - an outage that takes the box out takes the
# alert with it, which is the failure mode of every homelab monitor that has
# only ever been tested while the box was up.
#
# OFF UNTIL CONFIGURED, AND THAT IS NOT A HALF-FINISHED STATE. The three values
# below come from the vault and ship as placeholders; while any of them is still
# a placeholder the remote_write block is not rendered at all, Prometheus starts
# exactly as it did before, and the post-install output says what to populate.
# The alternative - asserting on them - would break a re-run of a working stack
# for the sake of a feature nobody had asked to turn on yet.
monitoring_remote_write_placeholder: CHANGEME

# The Prometheus push endpoint, the numeric instance id, and an Access Policy
# token scoped to metrics:write. All three are read from Grafana Cloud's own
# portal, under the stack's Prometheus "Details" / "Send Metrics" panel; the
# token is minted under Access Policies and is the only one of the three that is
# genuinely secret. All three are vaulted anyway - this tree is public, and the
# push URL names the region and instance.
#
# metrics:write AND NOTHING ELSE. A token that can also read or delete is a
# token that turns a compromised guest into a compromised history, and this
# process only ever pushes.
monitoring_remote_write_url: "{{ vault_grafana_cloud_prom_url }}"
monitoring_remote_write_username: "{{ vault_grafana_cloud_prom_username }}"
monitoring_remote_write_password: "{{ vault_grafana_cloud_prom_password }}"

# Rendered only when all three are real. Kept as one expression rather than a
# hand-set boolean so that populating the vault is the ONLY step - a separate
# `enabled` flag is a second thing to remember and a second thing to get wrong.
monitoring_remote_write_enabled: >-
  {{ monitoring_remote_write_url | default('', true) | length > 0
     and monitoring_remote_write_username | default('', true) | length > 0
     and monitoring_remote_write_password | default('', true) | length > 0
     and monitoring_remote_write_placeholder not in [
           monitoring_remote_write_url,
           monitoring_remote_write_username,
           monitoring_remote_write_password,
         ] }}

# The token is written to a file of its own at 0600 rather than inlined into
# prometheus.yml, and read with basic_auth's `password_file`. prometheus.yml is
# 0644 and is the file that gets rendered in the panel's file browser, pasted
# into a ticket and quoted in a diff; this one is neither. Same reasoning that
# puts the Grafana admin password in the stack's .env instead of the compose
# file.
monitoring_remote_write_password_file: "{{ monitoring_prometheus_dir }}/remote-write-password"
monitoring_remote_write_password_path: /etc/prometheus/remote-write-password

# AN ALLOWLIST, NOT A DENYLIST, AND THAT DIRECTION IS THE WHOLE POINT.
# Grafana Cloud bills on active series. The three scrape jobs above produce
# something over 150 of them, most of it the Node runtime's event-loop
# histograms and Go's own process gauges - none of which anyone will ever open,
# and all of which would be paid for every month.
#
# So samples are dropped unless their metric name appears here, and the list is
# short because it is meant to be: every entry should be something a dashboard
# or an alert actually reads. Adding one is a line here plus a re-run; the cost
# of getting it wrong in this direction is a missing series, which is visible.
# The cost of getting it wrong in the other direction is a bill.
#
#   cache_*                    - the Actions cache server's own counters. The
#                                reason this list exists at all: a flat
#                                cache_requests_total while CI is running is how
#                                a silently-reverted runner patch becomes
#                                visible instead of just cheap.
#   up                         - one series per target. Without it a target that
#                                stops answering is indistinguishable from a
#                                target with nothing to say.
#   process_start_time_seconds - one series per target, and it is what tells a
#                                counter reset apart from a genuine flatline.
#                                A restarted container zeroes every counter it
#                                exports; without this an alert reading those
#                                counters cannot tell which happened.
#   node_network_transmit_*    - THE THREE TRANSMIT COUNTERS, and the only
#                                metric names out of node_exporter's several
#                                hundred that leave the box. See the
#                                node_exporter section above for what they are
#                                being asked. Everything else that exporter
#                                produces - filesystem, CPU, the whole of
#                                netdev's receive side - stays in the local
#                                TSDB, at full resolution, for 90d.
#
# THESE THREE ARE PER INTERFACE, WHICH IS WHERE THE COST IS. The uplink, `lo`
# and the CNI bridge are stable, and there are three of them on each of four
# hosts. The per-microVM veth is not: `shutdown_on_exit: true` in
# ../fireactions/vars/main.yaml means a guest is destroyed after each job and
# the next one comes back under a new interface name. So the count at any
# instant is bounded by the pool replicas - ten guests a host, forty across the
# fleet - while the count over a month is however many jobs ran.
#
# That is accepted rather than overlooked, and the churn is the point: the
# per-guest interface is exactly where a black hole would be, and a counter
# aggregated away from it answers nothing. If the Cloud bill ever argues about
# it, the lever is a device filter on the exporter, not dropping these three.
monitoring_remote_write_keep_metrics:
  - cache_requests_total
  - cache_uploads_total
  - cache_storage_bytes
  - process_start_time_seconds
  - up
  - node_network_transmit_errs_total
  - node_network_transmit_drop_total
  - node_network_transmit_carrier_total

# Attached to every forwarded series, not to anything stored locally. Two jobs:
# it says which estate a series came from once more than one pushes to the same
# stack, and it stops `up{job="prometheus"}` from this box colliding with the
# identically-named series from anywhere else.
#
# NOT VAULTED, deliberately, unlike every hostname in this repo. These are
# already in this tree's directory names (live/ansible/inventories/petruk-pve/
# petruk-pve0), they resolve nowhere, and a label whose value is secret is a
# label nobody can use in a query they paste into a ticket.
monitoring_external_labels:
  site: petruk-pve0
  env: homelab

# ============================================
# Grafana
# ============================================
# Pinned for the same reason as Prometheus above. 13.1.1 is the current stable;
# check https://github.com/grafana/grafana/releases before moving it.
monitoring_grafana_version: 13.1.1

monitoring_grafana_container: grafana

# NOT 3000, which is Grafana's own default and the first thing you would reach
# for: Gitea already publishes 127.0.0.1:3000 on this box, exactly as it did to
# Athens. The container still listens on 3000 internally; only the host side
# moved. 3500 continues the 3300 (Athens) / 3400 (gha-cache) sequence.
monitoring_grafana_port: 3500

# The image's built-in unprivileged user - `ARG GF_UID="472"` / `ARG GF_GID="0"`
# in the upstream Dockerfile. Group 0 is not a typo and not a privilege: the
# image chowns its data to 472:root so the container works under an arbitrary
# uid on OpenShift, and the bind mount has to match what the process actually
# runs as.
monitoring_grafana_uid: 472
monitoring_grafana_gid: 0

monitoring_grafana_dir: "{{ monitoring_compose_dir }}/grafana"
monitoring_grafana_data_dir: "{{ monitoring_grafana_dir }}/data"
monitoring_grafana_datasource_dir: "{{ monitoring_grafana_dir }}/provisioning/datasources"
monitoring_grafana_datasource_file: "{{ monitoring_grafana_datasource_dir }}/prometheus.yml"

# The datasource is provisioned from a file rather than clicked in the UI, so a
# rebuilt stack comes back with it. `isDefault` matters more than it looks -
# every dashboard that does not name a datasource explicitly resolves to it.
monitoring_grafana_datasource_name: Prometheus

# ============================================
# Public names
# ============================================
# The TLS websites in front of these two - Unbound ALIASes onto the 1Panel host,
# not A records, because neither service has a guest of its own. Vaulted: this
# tree is public and a resolvable name is the first half of a reachable service.
# See live/ansible/README.md.
#
# Creating the websites is ../1panel/manage-websites.yaml's job, and it reads
# these two names out of THIS playbook's vault rather than keeping a copy - a
# value in two files is a value that can disagree.
monitoring_grafana_host: "{{ vault_grafana_host }}"
monitoring_prometheus_host: "{{ vault_prometheus_host }}"

# ============================================
# Secrets
# ============================================
# Sourced from vars/vault.yaml and written to the stack's .env, not into
# docker-compose.yml, so the password is not sitting in the file the dashboard
# renders on the compose detail page.
#
# THESE ARE BOOTSTRAP CREDENTIALS AND GRAFANA STOPS READING THEM. Both variables
# are only consulted while Grafana creates its admin user on an empty database;
# once ./grafana/data exists the account lives there and changing the vault does
# nothing. Rotating it afterwards is a `grafana-cli admin reset-admin-password`
# in the container, or the profile page - see the README.
monitoring_grafana_admin_user: "{{ vault_grafana_admin_user }}"
monitoring_grafana_admin_password: "{{ vault_grafana_admin_password }}"
