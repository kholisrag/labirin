---
# ============================================
# Pre-flight checks for Harbor
# ============================================
# Everything here is read-only. The point is to fail with an actionable message
# BEFORE we format a block device or hand control to the role.
# ============================================

- name: Assert a supported CPU architecture
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    fail_msg: >-
      Harbor only ships amd64/arm64 installers, this host reports
      '{{ ansible_facts['architecture'] }}'.
  tags:
    - always

- name: Set architecture fact
  ansible.builtin.set_fact:
    # Go-style naming, which is what the Docker apt repository uses.
    harbor_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"
  tags:
    - always

- name: Assert the distribution is supported
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: >-
      tasks/docker.yaml installs from Docker's apt repository, which assumes a
      Debian-family host. This one reports
      '{{ ansible_facts['os_family'] }}' - port the task or use the distro's
      own packages (note: they must include the compose v2 plugin).
  tags:
    - always

# Harbor's own guidance is 4 GiB minimum / 8 GiB recommended. Below 4 GiB the
# stack starts but Postgres and the jobservice fight over memory under load.
- name: Assert the host has enough memory
  ansible.builtin.assert:
    that:
      - ansible_facts['memtotal_mb'] >= 3800
    fail_msg: >-
      Harbor needs at least 4 GiB of RAM, this host has
      {{ ansible_facts['memtotal_mb'] }} MiB. The OpenTofu unit gives this VM
      8 GiB with a balloon floor of 4 GiB, so anything under that means the
      VM is not the one that unit describes.
  tags:
    - always

- name: Assert the admin password is configured
  ansible.builtin.assert:
    that:
      - harbor_admin_password is defined
      - harbor_admin_password | length >= 8
      - "'REPLACE_ME' not in harbor_admin_password"
      - harbor_admin_password != 'Harbor12345'
    fail_msg: >-
      harbor_admin_password is still a placeholder (or the upstream default).
      Populate it with:
      ansible-vault edit live/ansible/playbooks/harbor/vars/vault.yaml
  no_log: true
  tags:
    - always

# ---------------------------------------------------------------
# Is the installer tree already at the version we want?
# ---------------------------------------------------------------
# robertdebock.harbor's "Place harbor.yml" task and ours write different
# content to the same path, so left alone they flip it back and forth on every
# run - both report `changed`, both notify `Run installer`, and install.sh
# bounces the whole Compose stack every time the playbook is run. Harbor is a
# hard dependency for CI capacity now (the Fireactions runner image is pulled
# through it), so an unconditional restart is not acceptable.
#
# The fix is to run the role's tasks only when there is something to install.
# This marker records what the role last unarchived; it is written after the
# handler has flushed, so a failed install does not claim success.
- name: Read the installed Harbor version marker
  ansible.builtin.slurp:
    src: "{{ harbor_version_marker }}"
  register: harbor_version_marker_content
  failed_when: false
  changed_when: false
  tags:
    - always

- name: Decide whether the installer tree needs to be laid down
  ansible.builtin.set_fact:
    harbor_needs_install: >-
      {{ (harbor_version_marker_content.content | default('') | b64decode | trim) != harbor_version }}
  tags:
    - always

- name: Report the installer tree decision
  ansible.builtin.debug:
    msg: >-
      {{
        'Harbor ' ~ harbor_version ~ ' installer tree will be laid down'
        if harbor_needs_install
        else 'Harbor ' ~ harbor_version ~ ' already installed - skipping the role, install.sh runs only if harbor.yml changes'
      }}
  tags:
    - always

- name: Check the dedicated data block device
  ansible.builtin.stat:
    path: "{{ harbor_data_device }}"
    follow: true
  register: harbor_data_device_stat
  tags:
    - always

- name: Fail when the data block device is missing
  ansible.builtin.fail:
    msg:
      - "Data block device '{{ harbor_data_device }}' not found."
      - ""
      - "This playbook expects a second disk dedicated to Harbor's /data. The"
      - "OpenTofu unit attaches it as scsi1 with serial 'harbor-data', which"
      - "the guest exposes at the by-id path above."
      - ""
      - "Set harbor_data_device in vars/main.yaml if your host uses a"
      - "different device."
  when: not harbor_data_device_stat.stat.exists
  tags:
    - always

# Resolved without following the symlink so lnk_source gives the real device
# node (/dev/sdb), which is what ansible_facts.mounts reports.
- name: Resolve the data block device to its real device node
  ansible.builtin.stat:
    path: "{{ harbor_data_device }}"
    follow: false
  register: harbor_data_device_link
  tags:
    - always

- name: Determine the real data device node
  ansible.builtin.set_fact:
    harbor_data_real_device: >-
      {{ harbor_data_device_link.stat.lnk_source
         | default(harbor_data_device, true) }}
  tags:
    - always

# Matches both the whole device (/dev/sdb) and any partition on it (/dev/sdb1).
# A mount at harbor_data_mount is the expected steady state on every run after
# the first, so it is excluded - anything else means the disk is not ours.
- name: Gather unexpected mounts on the data block device
  ansible.builtin.set_fact:
    harbor_data_foreign_mounts: >-
      {{
        ansible_facts['mounts']
        | selectattr('device', 'match', harbor_data_real_device ~ '[0-9]*$')
        | map(attribute='mount')
        | reject('equalto', harbor_data_mount)
        | list
      }}
  tags:
    - always

- name: Fail when the data block device is in use elsewhere
  ansible.builtin.fail:
    msg:
      - "'{{ harbor_data_real_device }}' is mounted at:"
      - "{{ harbor_data_foreign_mounts | join(', ') }}"
      - ""
      - "This device is formatted and mounted at {{ harbor_data_mount }}."
      - "Refusing to touch a disk that is already serving something else."
  when: harbor_data_foreign_mounts | length > 0
  tags:
    - always
