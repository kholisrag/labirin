---
# ============================================
# 1Panel websites
# ============================================
# 1Panel keeps its websites in its own database, not in a config file, so the
# API is the only declarative surface there is. Everything already running on
# the 1Panel VM was created by hand in the dashboard; this file is where new
# ones go instead.
#
# Only reverse-proxy sites belong here. "Deployment" sites (ntfy, Home
# Assistant, Obsidian, ...) are bound to a 1Panel app install and are not
# expressible as a few fields.
#
# CREATE-ONLY, EXCEPT THE PROXY BLOCK. A site that already exists is not
# reconciled - its domains, group and certificate are left as you last set them
# in the UI - but its proxy `location` file IS rewritten from the template on
# every run, because that block is the part with behaviour we care about.
#
# A new entry here also needs a matching Unbound alias onto the 1Panel host in
# live/ansible/playbooks/opnsense/vars/vault.yaml, or the name will not resolve
# to OpenResty at all.
#
# EVERY DOMAIN BELOW IS VAULTED. This tree is public and a resolvable name is
# the first half of a reachable service, so the names live in ansible-vault and
# main.yaml carries only the reference. A name owned by another playbook is
# read from THAT playbook's vault rather than copied here - same rule as
# manage-databases.yaml reading ../gha-cache/vars/vault.yaml, and for the same
# reason: a value in two files is a value that can disagree. The cross-loads
# are in each playbook's vars_files. See live/ansible/README.md.

# 1Panel's "Default" website group.
onepanel_website_group_id: 2

# 1Panel's own default cipher suite, reproduced verbatim so that pushing the
# HTTPS settings does not quietly narrow the ciphers on a site that was set up
# through the dashboard. Taken from an existing site's GET /websites/:id/https.
onepanel_ssl_algorithm: >-
  ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED

# The tunnel connector VM's cloud-init payload, and the one place that guest's
# address is declared. manage-websites.yaml reads `.ethernets.id0.addresses[0]`
# out of it at run time for the dalang site's allow-list, so the value nginx
# allows is literally the field the machine boots with.
#
# It is NOT in dnsmasq_hosts and does not want to be: that list reserves
# addresses for DHCP clients keyed on a MAC, and this guest carries
# `dhcp4: false` and an address of its own. A reservation there would be a
# declaration with nothing serving it, and it would pass every check this
# repository has.
#
# Relative to playbook_dir so it survives being checked out anywhere.
onepanel_connector_network_config: >-
  {{ playbook_dir }}/../../../opentofu/proxmox/petruk-pve/petruk-pve0/vms/cloudflared/network-config.enc.yaml

onepanel_websites:
  - primary_domain: "{{ vault_harbor_registry_host }}"
    remark: Harbor Container Registry
    # The Harbor guest (harbor-01, 10.10.99.13). Harbor listens on plain
    # HTTP:80 because TLS is terminated here.
    #
    # An IP, not the guest's name, on purpose: nginx resolves a proxy_pass
    # hostname once at config load and caches it forever, so a name here would
    # make OpenResty's startup depend on Unbound being up and would not pick up
    # a changed address anyway. The address is a static DHCP reservation keyed
    # on the VM's MAC, so it is as stable as the name.
    upstream: http://10.10.99.13
    # Registry traffic is not ordinary web traffic - see the template.
    proxy_template: proxy-registry.conf.j2
    domains:
      - domain: "{{ vault_harbor_registry_host }}"
        port: 80

  # RustFS - two sites for one guest, and they cannot be merged into one.
  # S3 clients sign the request path (SigV4), so serving the API under a prefix
  # like /s3/ makes RustFS read `s3` as the bucket name and every request fails
  # signature validation. Upstream is explicit about this:
  # https://docs.rustfs.com/integration/nginx
  #
  # rustfs-01 is 10.10.99.14 - an IP rather than a name for the same reason as
  # Harbor above: nginx resolves a proxy_pass hostname once at config load and
  # caches it forever. The address is a static DHCP reservation keyed on the
  # VM's MAC, so it is as stable as the name would be.
  - primary_domain: "{{ vault_rustfs_s3_host }}"
    remark: RustFS S3 API
    upstream: http://10.10.99.14:9000
    proxy_template: proxy-rustfs-s3.conf.j2
    domains:
      - domain: "{{ vault_rustfs_s3_host }}"
        port: 80

  - primary_domain: "{{ vault_rustfs_console_host }}"
    remark: RustFS Console
    upstream: http://10.10.99.14:9001
    proxy_template: proxy-rustfs-console.conf.j2
    domains:
      - domain: "{{ vault_rustfs_console_host }}"
        port: 80

  - primary_domain: "{{ vault_athens_goproxy_host }}"
    remark: Athens Go Module Proxy
    # Athens runs ON this box, as the 1Panel compose stack `athens` - see
    # live/ansible/playbooks/athens/. Unlike Harbor there is no second VM.
    #
    # 127.0.0.1 works here and would NOT work for an ordinary containerised
    # nginx: 1Panel's OpenResty runs with `network_mode: host`, so its loopback
    # is the host's loopback. Athens publishes on 127.0.0.1 only, which means
    # this website is the single way in and there is no plaintext port
    # answering on the LAN.
    #
    # 3300, not Athens' default 3000, because Gitea already has 3000 on this
    # box. Kept in step with athens_port in ../../athens/vars/main.yaml.
    upstream: http://127.0.0.1:3300
    # A cold cache miss is a git clone; the default timeouts cut it off.
    proxy_template: proxy-athens.conf.j2
    domains:
      - domain: "{{ vault_athens_goproxy_host }}"
        port: 80

  # The GitHub Actions cache server - see live/ansible/playbooks/gha-cache/.
  # Same shape as Athens above and 127.0.0.1 for the same reason: it is a
  # compose stack on THIS box and OpenResty runs with `network_mode: host`, so
  # the loopback publish is reachable from nginx and from nowhere else.
  #
  # 3400 because 3000 is Gitea's and 3300 is Athens'. Kept in step with
  # gha_cache_port in ../../gha-cache/vars/main.yaml; nothing links them
  # automatically, and install-gha-cache.yaml preflights the port but has no
  # idea what this file says.
  #
  # It also has to match gha_cache_api_base_url over there, which is the URL
  # handed to runners as the upload and download endpoint - if this site's name
  # and that variable disagree, saves fail from the runner with the server
  # looking healthy.
  # DefectDojo, the security findings UI - the playbook is in oprek.sh, NOT
  # here. Same 127.0.0.1 reasoning as Athens and gha-cache above: a compose
  # stack on THIS box, published to loopback only, so OpenResty's
  # `network_mode: host` is what reaches it and nothing on the LAN does.
  #
  # 8181 rather than continuing the 3300/3400/3500 sequence, because the port
  # is chosen in the other repository and this entry follows it.
  #
  # Its domain is in THIS vault and not a `../defectdojo/vars/vault.yaml`,
  # which is the one place the rule above cannot be followed: the owning
  # service lives in a different repository and this one cannot read its vault.
  - primary_domain: "{{ vault_defectdojo_host }}"
    remark: DefectDojo Security Findings UI
    upstream: http://127.0.0.1:8181
    domains:
      - domain: "{{ vault_defectdojo_host }}"
        port: 80

  # dalang - the second service on this box whose playbook lives in the other
  # repository, and handled the same way DefectDojo above is: a compose stack
  # here, published to loopback, with its name and its port both chosen over
  # there. Same 127.0.0.1 reasoning as Athens and gha-cache - OpenResty runs
  # with `network_mode: host`, so the loopback publish is what nginx reaches and
  # nothing on the LAN does.
  #
  # 8185 rather than continuing the 3300/3400/3500/3600 sequence, for the same
  # reason DefectDojo is on 8181: the port is chosen in the other repository and
  # this entry follows it.
  #
  # Its domain is in THIS vault for the reason given above DefectDojo - the
  # owning service is in a different repository and this one cannot read its
  # vault - so name and port are both second copies and both can drift. The
  # symptom of the first is the one this file already names: a website created
  # for a name Unbound does not alias, which looks like a DNS problem rather
  # than a drifted copy. The other repository asserts that this origin answers
  # dalang when reached by this name, which is what makes the copies checked.
  #
  # THIS ENTRY IS NOT LIKE THE OTHERS AND ITS TEMPLATE IS WHY. The service
  # behind it serves a catalogue that takes no credential, so the proxy block
  # allows the tunnel connector and denies the rest of the LAN. Read the header
  # of proxy-dalang.conf.j2 before touching either file; dropping the Unbound
  # alias is NOT a substitute, because nginx picks the site by SNI.
  - primary_domain: "{{ vault_dalang_internal_host }}"
    remark: dalang (development)
    upstream: http://127.0.0.1:8185
    proxy_template: proxy-dalang.conf.j2
    domains:
      - domain: "{{ vault_dalang_internal_host }}"
        port: 80

  - primary_domain: "{{ vault_gha_cache_host }}"
    remark: GitHub Actions Cache Server
    upstream: http://127.0.0.1:3400
    # Cache saves are large PUTs; the stock block's 1m body cap 413s them.
    proxy_template: proxy-gha-cache.conf.j2
    domains:
      - domain: "{{ vault_gha_cache_host }}"
        port: 80

  # Grafana and Prometheus - see live/ansible/playbooks/monitoring/. One compose
  # stack on THIS box, two published ports, so 127.0.0.1 for the same reason as
  # Athens and gha-cache above: OpenResty runs with `network_mode: host`, so the
  # loopback publish is reachable from nginx and from nowhere else.
  #
  # 3500 continues the 3300 (Athens) / 3400 (gha-cache) sequence and exists
  # because Gitea holds 3000, which is Grafana's default. Prometheus keeps its
  # own 9090, which was free. Both are kept in step with
  # monitoring_grafana_port / monitoring_prometheus_port in
  # ../../monitoring/vars/main.yaml; nothing links them automatically, and
  # install-monitoring.yaml preflights the ports but has no idea what this file
  # says.
  #
  # These two names must also match monitoring_grafana_host and
  # GF_SERVER_ROOT_URL over there - Grafana builds its redirects from that
  # variable, so a disagreement presents as a login loop rather than a 404.
  - primary_domain: "{{ vault_grafana_host }}"
    remark: Grafana
    upstream: http://127.0.0.1:3500
    # Websockets for Grafana Live, and timeouts that outlast a range query.
    proxy_template: proxy-grafana.conf.j2
    domains:
      - domain: "{{ vault_grafana_host }}"
        port: 80

  # UNAUTHENTICATED, DELIBERATELY, AND THE TEMPLATE IS WHERE THAT IS BOUNDED.
  # Prometheus has no login of its own, so anything on the LAN that resolves
  # this name can read every metric and run any query. Grafana next door is the
  # authenticated view; this site exists for the expression browser and the
  # targets page. proxy-prometheus.conf.j2 denies the destructive endpoints -
  # read its header before changing either file.
  - primary_domain: "{{ vault_prometheus_host }}"
    remark: Prometheus
    upstream: http://127.0.0.1:9090
    proxy_template: proxy-prometheus.conf.j2
    domains:
      - domain: "{{ vault_prometheus_host }}"
        port: 80

  # Semaphore UI - see live/ansible/playbooks/semaphore/. Same shape as Athens,
  # gha-cache and Grafana above, and 127.0.0.1 for the same reason: it is a
  # compose stack on THIS box and OpenResty runs with `network_mode: host`, so
  # the loopback publish is reachable from nginx and from nowhere else.
  #
  # 3600 continues the 3300 / 3400 / 3500 sequence and exists because Gitea
  # holds 3000, which is Semaphore's default. Kept in step with semaphore_port
  # in ../../semaphore/vars/main.yaml; nothing links them automatically, and
  # install-semaphore.yaml preflights the port but has no idea what this file
  # says.
  #
  # The name must also match semaphore_web_root over there - Semaphore builds
  # its own absolute URLs from that variable, so a disagreement presents as a
  # login that bounces rather than as a 404.
  #
  # LOOPBACK IS LOAD-BEARING HERE IN A WAY IT IS NOT FOR A CACHE. This login
  # page fronts SSH to four hosts and the estate Ansible vault password, so a
  # second plaintext door on the LAN would undo ADR-0119 §C. ADR-0119 §H names
  # it a high-value target.
  - primary_domain: "{{ vault_semaphore_host }}"
    remark: Semaphore UI
    upstream: http://127.0.0.1:3600
    # Websockets for the live task log, and timeouts that outlast a four-host
    # serial apply.
    proxy_template: proxy-semaphore.conf.j2
    domains:
      - domain: "{{ vault_semaphore_host }}"
        port: 80

  # ------------------------------------------------------------------
  # Brought under management by the July 2026 drift scan. All three were
  # created by hand in the dashboard and had been serving for months with
  # nothing in this repo describing them.
  #
  # Their proxy blocks are transcribed VERBATIM into the templates, because
  # this file's create-only rule does not extend to the location block - that
  # is rewritten from the template on every run. A tidier block would have been
  # a silent behaviour change on the next unrelated run of this playbook.
  # ------------------------------------------------------------------

  - primary_domain: "{{ vault_fizzy_host }}"
    remark: Fizzy
    # The `fizzy` compose stack on this box, published on 127.0.0.1:8083.
    upstream: http://127.0.0.1:8083
    proxy_template: proxy-stock.conf.j2
    domains:
      - domain: "{{ vault_fizzy_host }}"
        port: 80

  - primary_domain: "{{ vault_gitea_mirror_host }}"
    remark: Gitea Mirror
    # The `gitea-mirror` compose stack on this box, published on 127.0.0.1:4321.
    upstream: http://127.0.0.1:4321
    proxy_template: proxy-stock.conf.j2
    domains:
      - domain: "{{ vault_gitea_mirror_host }}"
        port: 80

  - primary_domain: "{{ vault_openclaw_host }}"
    remark: OpenClaw
    # http, NOT the https the dashboard had. The upstream on :18789 speaks plain
    # HTTP, so the hand-made config was failing every request with
    # `SSL routines::wrong version number` and the site had been serving 502.
    # This is the only correction the drift scan made rather than transcribing -
    # see the header of proxy-openclaw.conf.j2.
    #
    # openclaw is an app-store install (createdBy "Apps"), so only the website
    # is expressible here; the stack itself is not.
    upstream: http://10.10.99.10:18789
    proxy_template: proxy-openclaw.conf.j2
    domains:
      - domain: "{{ vault_openclaw_host }}"
        port: 80

# ============================================
# 1Panel PostgreSQL databases
# ============================================
# Consumed by manage-databases.yaml. Same story as the websites above: the panel
# keeps these in its own database, so the API is the only declarative surface,
# and everything predating this list was made by hand in the dashboard.
#
# The app install these live in. It is the install's *name*, which is also the
# database container's name and the value the panel hands its own app installs
# as PANEL_DB_HOST - not a hostname that resolves anywhere else on the LAN.
onepanel_postgresql_app: postgresql

# CREATE-ONLY, and passwords are NOT stored here. Each entry points at the
# consuming service's own vault, because a credential written in two places is a
# credential that can disagree - and the way that presents is authentication
# failing against a database that is running perfectly, with neither file named
# in the error.
#
# The `_<suffix>` on the name and user is not decoration: it mirrors what the
# dashboard does when it creates a database, so a list made through the API and
# a list made by hand read the same way in the panel's UI.
onepanel_databases:
  - name: "{{ vault_gha_cache_db_name }}"
    username: "{{ vault_gha_cache_db_user }}"
    password: "{{ vault_gha_cache_db_password }}"
    description: GitHub Actions cache server

# ============================================
# 1Panel WAF (1pwaf) per-site overrides
# ============================================
# Consumed by manage-waf-overrides.yaml, which runs against the 1Panel guest
# rather than the API - 1pwaf's per-site rules are files on disk, not a
# documented API surface.

onepanel_waf_site_dir: /opt/1panel/apps/openresty/openresty/1pwaf/data/sites
onepanel_openresty_container: openresty

# Sites where the stock `TomcatBypass|Command|Base64` header rule has to lose
# its `Command` alternative. That rule substring-matches the request headers,
# and aws-cli v2 puts `md/command#<subcommand>` in its User-Agent on every
# single request - so without this, every aws-cli call to these sites gets the
# WAF's 403 block page and never reaches RustFS.
#
# Only add a site here if a legitimate client is being blocked by that rule.
# See the header comment in manage-waf-overrides.yaml for exactly what coverage
# is given up (very little) and what is kept (the log4shell rule, the scanner
# rule, and every other WAF module).
onepanel_waf_ua_command_sites:
  - "{{ vault_rustfs_s3_host }}"
  - "{{ vault_rustfs_console_host }}"

# Sites where the request-inspection modules have to be off entirely, because
# what they inspect is opaque signed binary and no rule edit can fix that.
#
# 1pwaf scans the request BODY, not just headers and the URI - verified by
# sending `1' or '1'='1` as a body to the RustFS S3 site and getting the
# 23,682-byte block page instead of RustFS's 110-byte XML. On an S3 endpoint
# the body is a compressed object, so the scan is running injection heuristics
# over gzip output. It false-positives, and it does so on SOME parts of the
# same upload and not others - which is exactly what was observed.
#
# NOT a size limit and not the User-Agent rule above: the stored match value
# for every denial is the whole 5 MiB part body, and it contains none of the
# tokens those rules carry.
#
# There is no narrower fix available. `Command` could be dropped from a header
# rule because a header is text with a knowable shape; a zstd stream has no
# token to exempt, so the choice is the module or nothing.
#
# What stays on for these sites: methodWhite, defaultUaBlack, defaultUrlBlack,
# header (minus the one token above), cookie, geoRestrict and cc.
#
# THE CONDITION IS THE BODY, NOT THE PROTOCOL. This started as an S3 list and
# it is not one: the test is whether a vhost carries opaque compressed bytes in
# a request body. A container registry does - a Docker layer PUT is a gzip or
# zstd tarball, byte for byte the same problem as an S3 part upload, and it
# fails the same way. Harbor was denied on 2 of 3 blob PUTs in one run
# (oprek-sh/oprek.sh#231) while `docker login` succeeded and the robot held
# `push:repository` on every project, with every project quota at -1.
#
# The partial failure is the signature, not a coincidence: injection heuristics
# over compressed output false-positive on some layers and not others, exactly
# as they did on some upload parts and not others.
onepanel_waf_no_body_scan_sites:
  - "{{ vault_rustfs_s3_host }}"
  - "{{ vault_gha_cache_host }}"
  - "{{ vault_harbor_registry_host }}"

# The modules to turn off on those sites. All three read attacker-controlled
# request data through injection heuristics: `sql` and `xss` via libinjection,
# `args` via regex over the query string. The S3 query string carries a base64
# uploadId, which is the same problem one layer up.
onepanel_waf_body_scan_modules:
  - sql
  - xss
  - args

# ============================================
# 1Panel connection
# ============================================
# Split out of vars/vault.yaml so the vault holds only what is actually
# secret - the API key, the obscured entrance path, and the host. Those four
# arrive as `vault_*` and are re-exported here under the names the playbooks
# already use, so nothing downstream changed.
#
# `panel_endpoint` is new, from the loose .creds.yaml this replaced. It is
# the API base plus a path, which is why it is its own variable rather than
# an edit to `panel_api_base` - that one is still composed from host + port
# and is what the three playbooks talk to.

panel_api_key: "{{ vault_panel_api_key }}"
panel_entrance: "{{ vault_panel_entrance }}"
panel_host: "{{ vault_panel_host }}"
panel_endpoint: "{{ vault_panel_endpoint }}"

# The acme wildcard, vaulted: it names the estate's apex zone.
cert_description: "{{ vault_acme_cert_description }}"
cert_directory: "{{ vault_acme_cert_directory }}"
cert_domain: "{{ vault_acme_cert_domain }}"
panel_api_base: "https://{{ panel_host }}:{{ panel_port }}"
panel_port: 11150
panel_upload_url: "{{ panel_api_base }}/api/v2/websites/ssl/upload"
scripts_dir: "{{ ansible_facts['user_dir'] }}/.acme/scripts"
ssl_id: 2
uploader_script: "{{ scripts_dir }}/1panel-ssl-uploader.sh"
