---
- name: Install the GitHub Actions cache server as a 1Panel compose stack
  hosts: localhost
  gather_facts: false

  vars:
    ansible_python_interpreter: "{{ playbook_dir | regex_replace('(.*labirin).*', '\\1') }}/.labirin_venv/bin/python3"

    # The stack's .env, written by 1Panel beside the compose file. Secrets go
    # here rather than into docker-compose.yml so the panel's compose detail
    # page renders no credentials.
    #
    # Docker Compose parses this file itself and expands ${...} inside it, so
    # every value has to be free of `$`, quotes and leading/trailing space. The
    # vault comments say so where the values are generated.
    gha_cache_compose_env: |
      GHA_CACHE_S3_ACCESS_KEY_ID={{ gha_cache_s3_access_key }}
      GHA_CACHE_S3_SECRET_ACCESS_KEY={{ gha_cache_s3_secret_key }}
      GHA_CACHE_DB_PASSWORD={{ gha_cache_db_password }}

  vars_files:
    - vars/main.yaml
    - vars/vault.yaml
    # panel_api_base / panel_api_key live with the other 1Panel API work rather
    # than being duplicated here - same panel, same key. main.yaml re-exports
    # the vault_* names the playbooks actually use, so both files are needed.
    - ../1panel/vars/main.yaml
    - ../1panel/vars/vault.yaml
    # And the S3 backend, for the same reason: the endpoint, region and root
    # credentials are the RustFS playbook's to define. A second copy here would
    # be a second thing to remember on a key rotation.
    - ../rustfs/vars/main.yaml
    - ../rustfs/vars/vault.yaml

  module_defaults:
    ansible.builtin.uri:
      validate_certs: true
      body_format: json
      status_code: 200

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - panel_api_base is defined
          - panel_api_key is defined
          - panel_api_key | length > 0
        fail_msg: >-
          panel_api_base / panel_api_key are missing. Populate them with:
          ansible-vault edit live/ansible/playbooks/1panel/vars/vault.yaml
      no_log: true
      tags:
        - always

    # Unlike Athens' GitHub token, none of these has a working empty state. The
    # S3 adapter's startup HeadBucket fails without credentials and the database
    # connection fails without a password - both several minutes into a deploy,
    # in container logs nobody is watching.
    #
    # The vault SHIPS with placeholders for the three database fields the panel
    # generates, so "unset" is the expected first state and catching it here is
    # the whole point rather than a formality.
    - name: Validate the stack's own secrets
      ansible.builtin.assert:
        that:
          - gha_cache_s3_access_key | length > 0
          - gha_cache_s3_secret_key | length > 0
          - gha_cache_db_name | length > 0
          - gha_cache_db_user | length > 0
          - gha_cache_db_password | length > 0
          - gha_cache_db_name != gha_cache_db_placeholder
          - gha_cache_db_user != gha_cache_db_placeholder
          - gha_cache_db_password != gha_cache_db_placeholder
        fail_msg: >-
          Database or S3 credentials are missing or still at their placeholder.
          The database name, user and password are generated by 1Panel when you
          create the database (Databases > PostgreSQL > Create) and have to be
          copied into
          live/ansible/playbooks/gha-cache/vars/vault.yaml;
          the S3 credentials come from
          live/ansible/playbooks/rustfs/vars/vault.yaml
          (vault_rustfs_access_key / vault_rustfs_secret_key).
          Edit either with `ansible-vault edit <file>`. See the README.
      no_log: true
      tags:
        - always

    # Same auth scheme as live/ansible/playbooks/1panel/manage-websites.yaml:
    # md5("1panel" + <api key> + <unix timestamp>) alongside the timestamp.
    #
    # THE TIMESTAMP IS ITS OWN FACT ON PURPOSE - see the long comment in
    # manage-websites.yaml. Inlining the lookup evaluates it twice and the two
    # evaluations occasionally straddle a second boundary, producing a token
    # signed with N sent with a header saying N+1.
    - name: Read the 1Panel API timestamp
      ansible.builtin.set_fact:
        onepanel_api_timestamp: "{{ lookup('pipe', 'date +%s') }}"
      tags:
        - always

    - name: Build the 1Panel API authentication headers
      ansible.builtin.set_fact:
        onepanel_api_headers:
          1Panel-Token: "{{ ('1panel' ~ panel_api_key ~ onepanel_api_timestamp) | hash('md5') }}"
          1Panel-Timestamp: "{{ onepanel_api_timestamp }}"
      no_log: true
      tags:
        - always

    # ===== DISCOVERY =====
    - name: List the existing compose stacks
      ansible.builtin.uri:
        url: "{{ panel_api_base }}/api/v2/containers/compose/search"
        method: POST
        headers: "{{ onepanel_api_headers }}"
        body:
          page: 1
          pageSize: 200
      register: onepanel_composes
      changed_when: false
      tags:
        - gha_cache

    # 1Panel answers an auth failure with HTTP 200 and a body of
    # {"code": <non-200>, ...} - the status line says nothing. Without this the
    # run dies several tasks later inside a Jinja expression, pointing nowhere
    # near the real problem.
    - name: Assert the 1Panel API accepted the request
      ansible.builtin.assert:
        that:
          - onepanel_composes.json.code | default(0) == 200
          - onepanel_composes.json.data is not none
        fail_msg: >-
          1Panel rejected the request
          (code={{ onepanel_composes.json.code | default('?') }},
          message={{ onepanel_composes.json.message | default('') | trim or 'none' }}).
          Causes, in the order they are worth checking:
          the API key is disabled in Panel Settings; this workstation's IP is
          not in the API key's allowlist; the key in
          live/ansible/playbooks/1panel/vars/vault.yaml is stale; or the signing
          timestamp fell outside the key's validity window.
      tags:
        - gha_cache

    # ===== PREFLIGHT =====
    # The 1Panel guest is a busy box - sixteen stacks publishing on loopback -
    # and docker reports a port clash only once the stack is already recorded,
    # leaving a stack that exists but will not start. 3000 is Gitea's and 3300
    # is Athens', which is how this check earned its place next door.
    - name: List the published container ports
      ansible.builtin.uri:
        url: "{{ panel_api_base }}/api/v2/containers/search"
        method: POST
        headers: "{{ onepanel_api_headers }}"
        body:
          page: 1
          pageSize: 300
          name: ""
          state: all
          orderBy: name
          order: "null"
          filters: ""
          excludeAppStore: false
      register: onepanel_containers
      changed_when: false
      tags:
        - gha_cache
        - preflight

    # A published port reads as "127.0.0.1:3400->3000/tcp". Match on the host
    # side only - the container side of the arrow collides constantly between
    # unrelated images and means nothing.
    - name: Find the containers already publishing the host port
      ansible.builtin.set_fact:
        onepanel_port_owners: "{{ onepanel_port_owners | default([]) + [item.name] }}"
      loop: "{{ onepanel_containers.json.data['items'] | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - item.ports is defined
        - item.ports is not none
        - item.ports | select('search', ':' ~ gha_cache_port ~ '->') | list | length > 0
      tags:
        - gha_cache
        - preflight

    - name: Assert the host port is free
      ansible.builtin.assert:
        that:
          - onepanel_port_conflicts | length == 0
        fail_msg: >-
          Host port {{ gha_cache_port }} is already published by
          {{ onepanel_port_conflicts | join(', ') }}.
          Pick another gha_cache_port in vars/main.yaml - the container keeps
          listening on 3000 internally either way, so only the left-hand side of
          the port mapping and the `upstream` in ../1panel/vars/main.yaml need
          to change.
      vars:
        # This stack is not a conflict with itself on a re-run.
        onepanel_port_conflicts: >-
          {{ onepanel_port_owners | default([]) | reject('equalto', gha_cache_container_name) | list }}
      tags:
        - gha_cache
        - preflight

    # ===== PREFLIGHT: THE EXTERNAL DATABASE =====
    # The stack owns no database of its own, so three things outside it have to
    # be true before the compose file is worth pushing. None of them can be
    # checked from inside the container in a way anyone would see: Postgres is
    # published on the guest's loopback only, so the control node cannot open a
    # socket to it, and a missing external network or a missing database
    # presents as a stack that exists and will not start.
    #
    # The panel can answer all three, read-only, in the same style as the port
    # check above. What it cannot answer is whether the PASSWORD is right - the
    # panel holds it, but this playbook has no business reading it back, so that
    # one failure is left to the container's own log.
    - name: List the container networks
      ansible.builtin.uri:
        url: "{{ panel_api_base }}/api/v2/containers/network/search"
        method: POST
        headers: "{{ onepanel_api_headers }}"
        body:
          page: 1
          pageSize: 100
          info: ""
          orderBy: created_at
          order: "null"
      register: onepanel_networks
      changed_when: false
      tags:
        - gha_cache
        - preflight

    - name: Assert the external network exists
      ansible.builtin.assert:
        that:
          - gha_cache_network in (onepanel_networks.json.data['items'] | default([]) | map(attribute='name') | list)
        fail_msg: >-
          Docker network '{{ gha_cache_network }}' does not exist on the 1Panel
          guest. The compose file declares it `external: true`, so Compose will
          refuse to create it and the stack will not start.
          This is 1Panel's own bridge - if a panel upgrade has renamed it,
          update gha_cache_network in vars/main.yaml to match.
      tags:
        - gha_cache
        - preflight

    - name: List the installed 1Panel apps
      ansible.builtin.uri:
        url: "{{ panel_api_base }}/api/v2/apps/installed/search"
        method: POST
        headers: "{{ onepanel_api_headers }}"
        body:
          page: 1
          pageSize: 100
          name: ""
          tags: []
          update: false
          sync: false
          type: ""
      register: onepanel_apps
      changed_when: false
      no_log: true # the response carries every app install's DB credentials
      tags:
        - gha_cache
        - preflight

    # Matched on the CONTAINER name rather than the app name, because the
    # container name is what DB_POSTGRES_HOST actually resolves over the bridge.
    # Checking the app exists but not that it is running would pass in exactly
    # the situation this is here to catch.
    - name: Assert the PostgreSQL app install is running
      ansible.builtin.assert:
        that:
          - gha_cache_db_hosts_running | length > 0
        fail_msg: >-
          No running 1Panel app install publishes the container
          '{{ gha_cache_db_host }}' that vault_gha_cache_db_host names.
          Check Apps > Installed in the dashboard: the PostgreSQL install has to
          exist and be Running before this stack can migrate its schema.
      vars:
        gha_cache_db_hosts_running: >-
          {{ onepanel_apps.json.data['items'] | default([])
             | selectattr('container', 'defined')
             | selectattr('container', 'equalto', gha_cache_db_host)
             | selectattr('status', 'equalto', 'Running') | list }}
      tags:
        - gha_cache
        - preflight

    # The panel is the registry of record for databases it created, so this is
    # the check that turns "the container crash-loops on a connection error"
    # into a task failure with the name in it.
    - name: List the PostgreSQL databases the panel knows about
      ansible.builtin.uri:
        url: "{{ panel_api_base }}/api/v2/databases/db/item/postgresql"
        method: GET
        headers: "{{ onepanel_api_headers }}"
      register: onepanel_pg_databases
      changed_when: false
      tags:
        - gha_cache
        - preflight

    - name: Assert the cache server's database exists
      ansible.builtin.assert:
        that:
          - gha_cache_db_name in (onepanel_pg_databases.json.data | default([]) | map(attribute='name') | list)
        fail_msg: >-
          PostgreSQL database '{{ gha_cache_db_name }}' does not exist.
          Create it in the dashboard - Databases > PostgreSQL > Create - and
          copy the name, user and password 1Panel generates into
          live/ansible/playbooks/gha-cache/vars/vault.yaml.
          Note that 1Panel appends a random suffix to the name you type, so the
          vault has to carry the generated name rather than the one you chose.
      tags:
        - gha_cache
        - preflight

    - name: Record whether the stack already exists
      ansible.builtin.set_fact:
        gha_cache_exists: >-
          {{ gha_cache_compose_name in (onepanel_composes.json.data['items'] | default([]) | map(attribute='name') | list) }}
      tags:
        - gha_cache

    # ===== STACK =====
    # Create and update are different endpoints with different bodies, and
    # neither one does the other's job: /compose 400s on a name that already
    # has a record, and /compose/update reads the existing file before writing
    # so it cannot bootstrap one.
    - name: Create the cache server compose stack
      ansible.builtin.uri:
        url: "{{ panel_api_base }}/api/v2/containers/compose"
        method: POST
        headers: "{{ onepanel_api_headers }}"
        body:
          name: "{{ gha_cache_compose_name }}"
          # "edit" means "here is the file content" - 1Panel writes it to
          # {DataDir}/docker/compose/{name}/docker-compose.yml itself. The
          # alternatives are "path" (a file already on the box) and "template".
          from: edit
          file: "{{ lookup('template', 'templates/docker-compose.yml.j2') }}"
          env: "{{ gha_cache_compose_env }}"
          forcePull: false
      when: not gha_cache_exists | bool
      register: gha_cache_created
      # Same trap as everything else here: a rejected body still answers 200.
      failed_when:
        - not gha_cache_created.skipped | default(false)
        - gha_cache_created.json.code | default(0) != 200
      no_log: true
      tags:
        - gha_cache

    - name: Update the cache server compose stack
      ansible.builtin.uri:
        url: "{{ panel_api_base }}/api/v2/containers/compose/update"
        method: POST
        headers: "{{ onepanel_api_headers }}"
        body:
          name: "{{ gha_cache_compose_name }}"
          # `path` is what gets `docker compose up`; `detailPath` is the file
          # the new content is written to. For a single-file stack they are the
          # same, but detailPath is read before the write and an empty one
          # fails the task with a bare "load file with path failed".
          path: "{{ gha_cache_compose_file }}"
          detailPath: "{{ gha_cache_compose_file }}"
          content: "{{ lookup('template', 'templates/docker-compose.yml.j2') }}"
          env: "{{ gha_cache_compose_env }}"
          forcePull: false
      when: gha_cache_exists | bool
      register: gha_cache_updated
      failed_when:
        - not gha_cache_updated.skipped | default(false)
        - gha_cache_updated.json.code | default(0) != 200
      no_log: true
      tags:
        - gha_cache

    # ===== CONVERGENCE =====
    # Both endpoints hand the work to a background task and return 200
    # immediately - the response says the request was accepted, not that the
    # container is up. Poll until it actually is, otherwise a failed image pull,
    # a missing bucket or a wrong database password looks like a successful run.
    #
    # One container: the database is the panel's, not this stack's.
    - name: Wait for the cache server container to be running
      ansible.builtin.uri:
        url: "{{ panel_api_base }}/api/v2/containers/compose/search"
        method: POST
        headers: "{{ onepanel_api_headers }}"
        body:
          page: 1
          pageSize: 200
      register: gha_cache_status
      until: >-
        (gha_cache_status.json.data['items'] | default([])
         | selectattr('name', 'equalto', gha_cache_compose_name) | list | first | default({})
        ).runningCount | default(0) | int >= 1
      retries: 30
      delay: 10
      changed_when: false
      tags:
        - gha_cache

    - name: Display post-install instructions
      ansible.builtin.debug:
        msg:
          - "========================================"
          - "GitHub Actions cache server {{ gha_cache_version }} running as 1Panel compose stack '{{ gha_cache_compose_name }}'"
          - "========================================"
          - ""
          - "Listening : {{ gha_cache_bind_address }}:{{ gha_cache_port }} on the 1Panel VM (loopback only)"
          - "Compose   : {{ gha_cache_compose_file }}"
          - "Network   : {{ gha_cache_network }} (external)"
          - "Database  : {{ gha_cache_db_name }} on {{ gha_cache_db_host }} (1Panel's PostgreSQL app install)"
          - "Objects   : {{ gha_cache_s3_endpoint }}/{{ gha_cache_s3_bucket }}"
          - "Budget    : {{ (gha_cache_max_size_bytes | int / 1073741824) | round(1) }} GiB"
          - ""
          - "It is not reachable yet unless the website exists. Create it with:"
          - "  ansible-playbook -i live/ansible/inventories/petruk-pve/petruk-pve0/pve-vms/1panel \\"
          - "    live/ansible/playbooks/1panel/manage-websites.yaml"
          - ""
          - "Then, from any box on the LAN:"
          - "  curl -fsS {{ gha_cache_api_base_url }}/health"
          - ""
          - "Runners are NOT pointed at this yet - that is ACTIONS_RESULTS_URL,"
          - "and it is deliberately not wired here. See the README."
          - ""
      tags:
        - always
