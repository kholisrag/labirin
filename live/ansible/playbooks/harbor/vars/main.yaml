---
# ============================================
# Harbor - container registry and pull-through proxy cache
# https://goharbor.io/docs/2.15.0/
# ============================================
# This host exists to be a cache. Nothing here pushes images: every project
# below is a proxy cache in front of an upstream registry, so the failure mode
# of losing the whole VM is "CI pulls from the internet again", not "we lost
# artifacts". That is what justifies backup=false on the data disk in the
# OpenTofu unit.

# --------------------------------------------
# Component versions
# --------------------------------------------
# https://github.com/goharbor/harbor/releases
#
# Consumed by robertdebock.harbor, whose vars/main.yml builds the installer URL
# as harbor-<installation_type>-installer-v<version>.tgz.
harbor_version: "2.15.0"

# "online" pulls the component images from Docker Hub at install time (~100 MiB
# tarball); "offline" ships them inside the tarball (~700 MiB). Online is right
# here - this host has good connectivity, and an offline installer would only
# help if the thing we are installing were already the mirror it depends on.
harbor_installation_type: online

# Records which version the installer tree at /home/harbor was laid down from,
# so a steady-state run can skip the role entirely instead of re-templating
# harbor.yml and restarting Harbor. See tasks/preflight.yaml.
harbor_version_marker: /etc/harbor-installed-version

# --------------------------------------------
# Identity
# --------------------------------------------
# The DNS name every client uses. It is an Unbound ALIAS onto the 1Panel host,
# not an A record for this guest: OpenResty on the 1Panel VM terminates TLS
# with the Let's Encrypt wildcard and reverse-proxies to port 80 here. The
# guest itself answers to a different name - vault_harbor_guest_host.
#
# Vaulted, like every name in this estate: the tree is public, and a resolvable
# name is the first half of a reachable service. See live/ansible/README.md.
#
# See live/ansible/playbooks/opnsense/vars/vault.yaml (unbound_host_aliases)
# and live/ansible/playbooks/1panel/manage-websites.yaml.
harbor_registry_host: "{{ vault_harbor_registry_host }}"

# When harbor_external_url is non-empty the role's template emits it and
# Harbor ignores harbor_hostname - but the role still asserts the hostname is
# a non-empty string, so both are set.
harbor_hostname: "{{ harbor_registry_host }}"
harbor_external_url: "https://{{ harbor_registry_host }}"

# Only applied on the FIRST install; changing it later does nothing (change it
# in the UI, then mirror it back into the vault).
harbor_admin_password: "{{ vault_harbor_admin_password }}"

# Password for Harbor's bundled Postgres. Reachable only over the Compose
# network - no port is published - but the upstream default is the literal
# string "root123", so it is worth not being that.
#
# Also first-install-only: Postgres initialises its superuser once, and
# changing this afterwards leaves harbor-core unable to connect.
harbor_db_password: "{{ vault_harbor_db_password }}"

# --------------------------------------------
# Tuning
# --------------------------------------------
# Concurrent jobservice workers. These run replication, retention and GC - for
# a pull-through cache the load is retention sweeps rather than replication, so
# the upstream default is more than enough.
harbor_max_job_workers: 10
harbor_log_level: info

# --------------------------------------------
# Data volume
# --------------------------------------------
# Dedicated block device holding /data - registry blobs, Postgres, Redis and
# the job logs. Addressed by disk serial (set in the OpenTofu unit at
# live/opentofu/proxmox/petruk-pve/petruk-pve0/vms/harbor/terragrunt.hcl)
# rather than /dev/sdb, which is not stable across reboots.
#
# Note the "S" prefix: QEMU exposes a user-set serial as
# scsi-SQEMU_QEMU_HARDDISK_<serial>.
harbor_data_device: /dev/disk/by-id/scsi-SQEMU_QEMU_HARDDISK_harbor-data
harbor_data_filesystem: ext4
# Feeds both the mount and `data_volume:` in templates/harbor.yml.j2, so the two
# cannot drift. (The role's own template hardcodes /data, which is one of the
# reasons that template is replaced - see tasks/harbor-config.yaml.)
harbor_data_mount: /data

# --------------------------------------------
# Docker
# --------------------------------------------
# Harbor ships as a Compose stack, so the engine and the compose v2 plugin are
# both required. Installed from Docker's own apt repository rather than
# Ubuntu's docker.io package, which has no compose plugin.
harbor_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
harbor_docker_apt_key_url: https://download.docker.com/linux/ubuntu/gpg
harbor_docker_apt_keyring: /etc/apt/keyrings/docker.asc
harbor_docker_apt_repo: >-
  deb [arch={{ harbor_arch | default('amd64') }} signed-by={{ harbor_docker_apt_keyring }}]
  https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable

# --------------------------------------------
# API
# --------------------------------------------
# Talk to Harbor over the loopback, not through harbor_external_url. The
# external name resolves to the 1Panel VM, so using it here would make every
# post-install task depend on OpenResty being configured first - a circular
# bootstrap, since the 1Panel site is created from a different playbook.
harbor_api_base: http://127.0.0.1/api/v2.0
harbor_api_user: admin
# Harbor takes ~60-90s from `install.sh` returning to the core API answering.
harbor_api_ready_retries: 30
harbor_api_ready_delay: 10

# --------------------------------------------
# Upstream registry endpoints
# --------------------------------------------
# `type` must be one of Harbor's adapter names (src/pkg/reg/model/registry.go).
# The adapter is not cosmetic: docker-hub knows about the token endpoint and
# the rate-limit headers, github-ghcr knows ghcr's auth scheme. A plain
# `docker-registry` against hub.docker.com would authenticate incorrectly.
#
# Credentials are optional and default to anonymous. Docker Hub anonymous pulls
# are rate-limited per source IP, and this cache is a single source IP for the
# whole homelab, so filling in vault_harbor_dockerhub_* is worth doing before
# CI leans on it. Harbor uses HEAD to revalidate cached manifests, which does
# not count against the limiter.
#
# Every credential is `basic` - an access key and an access secret, which for
# all three upstreams below means "a username and a token", never an account
# password. What goes in each pair differs per registry; see vars/vault.yaml.
#
# Credentials on an endpoint that ALREADY EXISTS are reconciled by
# tasks/proxy-cache.yaml, unlike the endpoints and projects themselves, which
# are create-only. Filling in a vault value therefore takes effect on the next
# `--tags proxy-cache` run without deleting anything.
harbor_registries:
  - name: dockerhub
    type: docker-hub
    url: https://hub.docker.com
    description: Docker Hub upstream
    access_key: "{{ vault_harbor_dockerhub_username | default('') }}"
    access_secret: "{{ vault_harbor_dockerhub_token | default('') }}"
  - name: ghcr
    type: github-ghcr
    url: https://ghcr.io
    description: GitHub Container Registry upstream
    access_key: "{{ vault_harbor_ghcr_username | default('') }}"
    access_secret: "{{ vault_harbor_ghcr_token | default('') }}"
  # NOT type `quay`, even though that adapter exists and Harbor's docs list
  # Quay as supported. Proxy cache projects are additionally gated on
  # PERMITTED_REGISTRY_TYPES_FOR_PROXY_CACHE, which in 2.15 is:
  #   docker-hub, harbor, azure-acr, ali-acr, aws-ecr, google-gcr,
  #   docker-registry, github-ghcr, jfrog-artifactory
  # A `quay` endpoint is accepted, and then the project creation fails with
  # `bad request: unsupported registry type quay`. quay.io is a plain OCI
  # registry for public pulls, so the generic adapter is all it needs.
  - name: quay
    type: docker-registry
    url: https://quay.io
    description: Quay.io upstream (generic adapter - see note above)
    access_key: "{{ vault_harbor_quay_username | default('') }}"
    access_secret: "{{ vault_harbor_quay_token | default('') }}"
  # registry.k8s.io has no accounts to authenticate as - it is an anonymous,
  # unmetered redirector in front of the regional mirrors. There is nothing to
  # put here, so this endpoint stays credential-less on purpose.
  - name: k8s
    type: docker-registry
    url: https://registry.k8s.io
    description: Kubernetes registry upstream (anonymous - no accounts exist)
    access_key: ""
    access_secret: ""

# --------------------------------------------
# Credential reconciliation
# --------------------------------------------
# Harbor never returns a stored access secret - GET /registries masks it as the
# literal "*****" - so a run can tell whether an endpoint HAS a secret, and what
# its username is, but not whether the secret still matches the vault. The
# reconcile in tasks/proxy-cache.yaml therefore rewrites credentials when the
# username changes, or when a secret appears or disappears, and leaves them
# alone otherwise. That keeps a steady-state run idempotent.
#
# The gap is rotating a token WITHOUT changing the username, which looks
# identical from the API. Set this to true for that run:
#
#   ansible-playbook ... --tags proxy-cache \
#     -e harbor_registry_credentials_force_update=true
harbor_registry_credentials_force_update: false

# After writing credentials, ask Harbor to reach each upstream with them
# (POST /registries/ping). Bad credentials do not fail the write - they fail
# later, at pull time, as a misleading 404 or `unauthorized` on an image that
# clearly exists - so this is where a typo in the vault gets caught.
harbor_registry_verify_credentials: true

# --------------------------------------------
# Proxy cache projects
# --------------------------------------------
# One project per upstream. The project name becomes the first path segment,
# and the rest of the path is passed through verbatim:
#
#   docker.io/library/alpine:3
#     -> <registry-host>/dockerhub/library/alpine:3
#   ghcr.io/hostinger/fireactions-images/ubuntu24.04:2026...
#     -> <registry-host>/ghcr/hostinger/fireactions-images/ubuntu24.04:2026...
#
# <registry-host> is harbor_registry_host, which is vaulted.
#
# The `library/` prefix is NOT optional for Docker Hub official images. Docker
# only expands the bare name `alpine` into `library/alpine` for Docker Hub
# itself; against any other registry host the short form is a 404.
#
# PUBLIC ON PURPOSE. Anonymous pull has to work: the Fireactions hosts pull the
# runner image with containerd's default resolver, which carries no credentials
# and has nowhere to put any. A private project would take CI down.
# Access is bounded by the LAN and by the fact that a proxy cache can only ever
# serve what its upstream would already serve anonymously.
#
# You cannot push to a proxy cache project. Harbor creates each one with a
# 7-day retention policy; that window is the actual sizing input for the
# 300 GiB data disk.
harbor_proxy_projects:
  - name: dockerhub
    registry: dockerhub
    public: true
  - name: ghcr
    registry: ghcr
    public: true
  - name: quay
    registry: quay
    public: true
  - name: k8s
    registry: k8s
    public: true

# --------------------------------------------
# System configuration
# --------------------------------------------
# `everyone` or `adminonly`. Harbor's default is `everyone`, which means every
# authenticated principal on this instance can create a project - the gate is
# not reached at all, so a robot's permissions never enter into it.
#
# `adminonly` turns the gate on, and it is then satisfied by a system admin OR
# by a system-level robot holding `system:/:project:create`. That is a
# permission check rather than an is-an-admin one, whatever CreateProject's
# `isSysAdmin` helper is called; tasks/configurations.yaml carries the detail.
#
# What this DOES stop: an ordinary user account, and any robot without that
# grant, creating projects on a registry whose projects are declared elsewhere.
harbor_project_creation_restriction: adminonly

# --------------------------------------------
# Garbage collection
# --------------------------------------------
# Retention MARKS and garbage collection RECLAIMS - two halves, and this host
# only ever had the first. Every proxy cache project carries an auto-created
# `nDaysSinceLastPull = 7` rule triggered at `0 0 0 * * *`, so artifacts have
# been swept into the artifact trash nightly since the day Harbor came up and
# not one byte has left /data. tasks/gc.yaml is the other half.
#
# SIX FIELDS, seconds first, and Harbor rejects any value but `0` there
# (ValidateCronString in src/common/utils). 03:00 daily, three hours behind the
# retention sweeps, so a run reclaims what last night marked rather than what
# the night before did.
harbor_gc_schedule_type: Custom
harbor_gc_cron: "0 0 3 * * *"

# UNTAGGED IS NOT THE SAME AS UNWANTED here, which is why this is false and why
# false is the value that has to be written down: the GC job defaults it to
# TRUE when the parameter is absent (parseParams in the jobservice gc job).
#
# An untagged artifact on this host is either something pulled through a cache
# by digest - which retention's `**` tag selector never marks, since it has no
# tag to match - or an un-tagged manifest in one of the two real projects. The
# first would go cold every night for the digest-pinned pulls GitOps tooling
# makes constantly; the second is a deletion nothing here can undo, on a disk
# that is deliberately not backed up.
#
# The cost is a slow leak: a digest-only cache entry is now reclaimed by
# nothing. That is a bounded, visible cost against an unbounded one, and
# flipping this is a one-line change once a run's logs show what it would take.
harbor_gc_delete_untagged: false

# Blob-removal concurrency, 1..10 - Harbor rejects anything outside that as a
# 400. One is the upstream default and is ample for a host whose GC input is a
# week of cache evictions.
harbor_gc_workers: 1

# Report what a run would remove without removing it. Worth one run of `true`
# before trusting a new `harbor_gc_delete_untagged`.
harbor_gc_dry_run: false

# --------------------------------------------
# System robot grants
# --------------------------------------------
# What a system-level robot on this Harbor is allowed to do. The robots are
# created by hand, once; tasks/robots.yaml only reconciles their grants, and it
# only ever WIDENS - see the header there for why a PUT that narrows is the
# dangerous direction.
#
# VAULTED, and not because a robot's account name is a secret. This repository
# is public and this Harbor serves private projects belonging to other
# repositories; the names of those accounts, and of the projects they can
# reach, are theirs to publish rather than ours. So the declaration lives in
# vars/vault.yaml and the default here is empty, which skips the tasks
# entirely.
#
# Each entry is:
#
#   - name: <robot name WITHOUT the `robot$` prefix>
#     permissions:
#       - kind: system            # namespace is always `/` for kind: system
#         namespace: /
#         access:
#           - { resource: project, action: create }
#       - kind: project           # `*` for every project, or one project name
#         namespace: some-project
#         access:
#           - { resource: robot, action: list }
#
# `resource`/`action` pairs must exist in Harbor's own catalogue for that scope
# (src/common/rbac/const.go); a pair that does not is a 400, not a silent
# no-op. GET /permissions lists them, and needs admin.
harbor_system_robots_managed: "{{ vault_harbor_system_robots_managed | default([]) }}"
