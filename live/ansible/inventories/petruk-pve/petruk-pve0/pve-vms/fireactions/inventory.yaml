fireactions_all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
  hosts:
    # One entry per Fireactions host. Every host runs the same pool definitions
    # from vars/main.yaml, which is what makes them one logical pool as far as
    # GitHub is concerned - so this file is the only place host count is
    # expressed on the Ansible side.
    #
    # ONE EXCEPTION, AND IT IS DELIBERATELY VISIBLE: a host with a file in a
    # host_vars/ directory beside this one setting `fireactions_canary`
    # resolves those same definitions to a different label set, which takes it
    # out of the shared pool for the length of a rollout window. The pool
    # definitions are still identical; what differs is what GitHub will
    # dispatch to them. There is no host_vars/ here outside a window - its
    # absence is the off state - so `ls` answers whether one is open. See
    # ../../../../../playbooks/fireactions/README.md § "The canary".
    #
    # RESOLVABLE NAMES, NOT ~/.ssh/config ALIASES. These used to read
    # `petruk-pve0-fireactions-0N`, which is a Host stanza in one operator's
    # ~/.ssh/config and resolves nowhere else - so this inventory only ever
    # worked from that laptop. It is DNS now: unbound_hosts in
    # ../../../../../playbooks/opnsense/vars/vault.yaml carries an A record for
    # each of the four, and the same names answer from anywhere on the LAN.
    #
    # That is a requirement rather than a tidy-up. The unattended apply runs
    # from a container on the 1Panel box (ADR-0119, ADR-0125), which has no
    # ssh_config and never had one; every host in this file was UNREACHABLE on
    # its first run. Adding a stanza to the container would put the host list in
    # a second place, and this file is meant to be the only one.
    fireactions_vm_01:
      ansible_host: fireactions-01.internal.khol.is
      ansible_user: ansible
    fireactions_vm_02:
      ansible_host: fireactions-02.internal.khol.is
      ansible_user: ansible
    fireactions_vm_03:
      ansible_host: fireactions-03.internal.khol.is
      ansible_user: ansible
    fireactions_vm_04:
      ansible_host: fireactions-04.internal.khol.is
      ansible_user: ansible
