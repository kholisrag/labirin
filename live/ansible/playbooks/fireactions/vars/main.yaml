---
# ============================================
# Fireactions - GitHub Actions runner orchestrator on Firecracker microVMs
# https://fireactions.io/latest/
# ============================================

# --------------------------------------------
# Component versions
# --------------------------------------------
# Fireactions itself.
#
# This is a FORK, not upstream. Upstream v2.0.5 can only register runners at
# organisation level - RunnerConfig has no `repository` field - so personal
# repositories under github.com/kholisrag cannot use it at all. The fork adds
# repository-scoped pools (and fixes a validation bug where the `pools` list was
# never descended into, so nothing inside a pool was ever validated upstream).
#
# It tracks upstream tags with a `-personal.N` suffix, and release assets follow
# upstream's naming exactly, so switching back is just these two variables.
#   fork:     https://github.com/kholisrag/fireactions/releases
#   upstream: https://github.com/hostinger/fireactions/releases
fireactions_release_repo: kholisrag/fireactions
fireactions_version: "2.0.5-personal.1"

# Firecracker. Pinned to the version the Fireactions install docs are written
# against. 1.16.1 was also tried and behaves identically, so this pin is
# conservatism rather than a known incompatibility - bump deliberately and
# re-run the first-build smoke test.
# https://github.com/firecracker-microvm/firecracker/releases
firecracker_version: "1.9.1"

# Containerd must stay on the 1.7.x line: the devmapper snapshotter that
# Fireactions depends on was removed from containerd 2.x.
# https://github.com/containerd/containerd/releases
containerd_version: "1.7.34"

# Matches the version Fireactions itself vendors (see containernetworking/plugins
# in its go.mod). The v1.6.1 the upstream install docs mention no longer has
# release assets on GitHub.
# https://github.com/containernetworking/plugins/releases
cni_plugins_version: "1.9.1"

# https://github.com/hostinger/tc-redirect-tap/releases
tc_redirect_tap_version: "0.0.1"

# Guest kernel for the microVMs.
#
# NOT Hostinger's prebuilt kernel. Theirs is built without ACPI, and on this
# host every virtio device is rejected at probe time:
#   virtio_blk: probe of virtio0 failed with error -22
# leaving the guest with no root device -> 'Cannot open root device "vda"'.
# Reproduced on Firecracker 1.9.1 and 1.16.1 and on both published Hostinger
# builds, so it is the kernel, not the VMM.
#
# The official Firecracker CI kernel is ACPI-capable and enumerates the
# virtio-mmio devices through ACPI, which works - but ONLY with "noapic"
# removed from fireactions_kernel_args (see below).
fireactions_kernel_version: "5.10.223"
fireactions_kernel_ci_channel: "v1.10"

# --------------------------------------------
# Paths
# --------------------------------------------
fireactions_bin_dir: /usr/local/bin
fireactions_config_dir: /etc/fireactions
fireactions_config_file: "{{ fireactions_config_dir }}/config.yaml"
fireactions_data_dir: /var/lib/fireactions
fireactions_kernel_dir: "{{ fireactions_data_dir }}/kernels/{{ fireactions_kernel_version }}"
fireactions_kernel_image_path: "{{ fireactions_kernel_dir }}/vmlinux"

# --------------------------------------------
# Release URLs
# --------------------------------------------
fireactions_release_base_url: >-
  https://github.com/{{ fireactions_release_repo }}/releases/download/v{{ fireactions_version }}
fireactions_release_url: >-
  {{ fireactions_release_base_url }}/fireactions-v{{ fireactions_version }}-linux-{{ fireactions_arch }}.tar.gz
fireactions_release_checksums_url: >-
  {{ fireactions_release_base_url }}/fireactions-v{{ fireactions_version }}-checksums.txt

# Uses uname -m naming (x86_64 / aarch64), unlike the Go-style arch used for
# the other downloads.
fireactions_kernel_url: >-
  https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/{{ fireactions_kernel_ci_channel }}/{{ fireactions_uname_arch }}/vmlinux-{{ fireactions_kernel_version }}
# "noapic" is deliberately REMOVED from upstream's default string. With an
# ACPI-capable kernel the virtio-mmio devices are enumerated via ACPI, and
# noapic disables the IOAPIC so those devices never get an IRQ:
#   virtio-mmio LNRO0005:01: IRQ index 0 not found
# Firecracker also appends its own virtio_mmio.device= entries, which then
# collide with the ACPI-claimed regions:
#   virtio-mmio virtio-mmio.0: can't request region ... failed with error -16
# That -16 is harmless noise - the ACPI-discovered devices are the ones that
# actually work. Removing noapic is what makes the guest find /dev/vda.
fireactions_kernel_args: "console=ttyS0 reboot=k panic=1 pci=off nomodules rw"
fireactions_cni_bin_dir: /opt/cni/bin
fireactions_cni_conf_dir: /etc/cni/net.d

# --------------------------------------------
# Containerd devmapper thin pool
# --------------------------------------------
# Dedicated block device consumed by the devmapper snapshotter. This device is
# WIPED on first run. Addressed by disk serial (set in the OpenTofu unit at
# live/opentofu/proxmox/petruk-pve/petruk-pve0/vms/fireactions/terragrunt.hcl)
# rather than /dev/sdb, which is not stable across reboots.
#
# Note the "S" prefix: QEMU exposes a user-set serial as
# scsi-SQEMU_QEMU_HARDDISK_<serial>. The "0" prefix form
# (scsi-0QEMU_QEMU_HARDDISK_drive-scsi1) is the device-name id, which is NOT
# stable if disks are reordered - that is the whole reason we set a serial.
fireactions_containerd_device: /dev/disk/by-id/scsi-SQEMU_QEMU_HARDDISK_containerd
fireactions_containerd_volume_group: containerd
fireactions_containerd_thinpool_name: thinpool
# dm device name = "<volume group>-<thin pool>", this is what containerd wants.
fireactions_containerd_pool_name: "{{ fireactions_containerd_volume_group }}-{{ fireactions_containerd_thinpool_name }}"
fireactions_containerd_thinpool_size: "95%VG"
fireactions_containerd_thinpool_metadata_size: 1G
# Maximum size of a single microVM root device. Runner images are large; 30GB
# is the Fireactions default and leaves room for Docker layers built in-job.
fireactions_containerd_base_image_size: "30GB"
fireactions_containerd_address: /run/containerd/containerd.sock
fireactions_containerd_namespace: fireactions

# --------------------------------------------
# CNI network for the microVMs
# --------------------------------------------
# Private, NAT'ed subnet used only inside the Fireactions host. Must not overlap
# with the homelab LAN (10.10.0.0/16) or the Proxmox WAN side (192.168.3.0/24).
fireactions_cni_network_name: fireactions
fireactions_cni_bridge: fireactions-br0
fireactions_cni_subnet: 192.168.128.0/23
fireactions_cni_mtu: 1500

# --------------------------------------------
# Fireactions server
# --------------------------------------------
fireactions_bind_address: 127.0.0.1:8080
fireactions_metrics_enabled: true
# Bound to the LAN address so Prometheus can scrape /metrics from elsewhere.
fireactions_metrics_address: 0.0.0.0:8081
fireactions_log_level: info

# --------------------------------------------
# GitHub
# --------------------------------------------
# A pool's runners register EITHER with an organisation or with a single
# repository - exactly one of `organization` / `repository` per pool. Every pool
# below is organisation-scoped; the repository-scoped tier that used to serve
# personal repos under `kholisrag` was retired once that work moved into the
# oprek-sh org.
#
# Repository scope is still available (it is the fork's addition, and the only
# option for personal accounts, which have no runner groups). To use it, set
# `repository: <owner>/<repo>` on a pool INSTEAD of `organization` + `group_id`,
# and install the App on that repo's owner with Administration: read+write. The
# installation is discovered automatically per scope, so no installation_id
# needs pinning.
fireactions_github_organization: oprek-sh
# 1 is the "Default" self-hosted runner group. Organisation pools only.
fireactions_github_runner_group_id: 1

# Secrets come from vars/vault.yaml (ansible-vault).
fireactions_github_app_id: "{{ vault_fireactions_github_app_id }}"
fireactions_github_app_private_key: "{{ vault_fireactions_github_app_private_key }}"

# --------------------------------------------
# Runner image
# --------------------------------------------
# Pinned rather than :latest so a pool restart cannot silently change the
# toolchain mid-week. Tags: https://github.com/hostinger/fireactions-images/pkgs/container/fireactions-images%2Fubuntu24.04
fireactions_runner_image: ghcr.io/hostinger/fireactions-images/ubuntu24.04:20260702062356

# --------------------------------------------
# Pools
# --------------------------------------------
# A pool is host-local: each Fireactions host keeps its own `replicas` count and
# there is no cross-host scheduler. Several hosts form one logical pool purely
# by sharing runner labels - GitHub load-balances across every runner carrying
# them. Total concurrency = sum of replicas over all hosts in the inventory.
#
# NO AUTOSCALING. Fireactions has no webhook handler and no workflow_job
# awareness (the only HTTP surface is /metrics); Pool.Run() just holds the pool
# at `replicas` forever, replacing each microVM as a job consumes it. So the
# replica count IS the concurrency limit - size it for the widest simultaneous
# fan-out you expect, not for the average.
#
# For a one-off burst there is a live, no-restart lever that does not need this
# file (it is lost on service restart, so mirror any keeper back to here):
#   sudo fireactions pools scale fireactions-small --replicas 8
#
# MEMORY BUDGET for one 32 GiB host (see the OpenTofu unit for the node-level
# budget). mem_size_mib is a CEILING, not a reservation: Firecracker backs guest
# RAM with a lazily-populated anonymous mmap, so a microVM only holds what the
# guest has actually touched. Measured on these hosts:
#
#   idle microVM   ~0.6-0.9 GiB RSS, whatever its mem_size_mib (a 12 GiB "large"
#                  sitting idle measured 778 MiB)
#   microVM running a scan/build job   ~2.9 GiB for a 4 GiB small
#
# So the budget has two numbers, and only the first one is always true:
#
#                                          idle floor    ceiling if ALL busy
#   small       2 vCPU x  4 GiB x 5    =     ~4.0 GiB          20 GiB
#   medium      4 vCPU x  8 GiB x 1    =     ~0.7 GiB           8 GiB
#   large       8 vCPU x 12 GiB x 1    =     ~0.8 GiB          12 GiB
#   ---------------------------------------------------------------------
#   total                        7 VMs      ~5.5 GiB          40 GiB
#
# The ceiling column is deliberately overcommitted ~1.25x against 32 GiB. That is
# safe here because the host has only 8 physical vCPU: at most ~8 microVMs can
# make progress at once, the CI jobs are scanners and Go builds rather than
# memory hogs, and the idle floor leaves ~25 GiB of real headroom. There is no
# swap and vm.overcommit_memory is 0 (heuristic), so if that assumption ever
# breaks the OOM killer takes a microVM, not the host. Watch `free -m` after
# raising a tier.
#
# The small tier is sized 5 per host = 10 org-wide because that is what a single
# oprek.sh PR asks for: security.yml fans out to 7 jobs and ci.yml adds 2, all on
# `[self-hosted, fireactions-small]`. At 1 per host they queued 1-6 minutes each,
# serialised behind two runners. Retiring the repository-scoped tier freed a
# further 8 GiB of ceiling per host, so raising `small` again is cheap - nothing
# else is competing for it, since no workflow currently targets medium or large.
#
# mem_size_mib for small stays at 4 GiB rather than being trimmed to buy more
# replicas: a live job was measured at 2.9 GiB, so 3 GiB would start OOM-killing
# real work. vCPU is oversubscribed ~3:1 against the VM's 8, which is fine for CI
# - Firecracker vCPU threads only burn host CPU when the guest is running.
#
# LABEL SELECTION:
#   runs-on: fireactions-small        -> that tier only
#   runs-on: [self-hosted, fireactions] -> ANY tier, whichever is idle. Handy,
#                                        but it can hand a trivial job a large
#                                        microVM. Prefer the explicit tier.
# Every pool is org-scoped, so only workflows in oprek-sh repositories can see
# these runners. Should a repository-scoped pool ever be added back, note that
# the two scopes are never interchangeable - GitHub does not offer an org runner
# to a repo-scoped workflow, or vice versa, even with identical labels.
fireactions_pools:
  - name: fireactions-small
    # 5 per host = 10 org-wide. Every oprek.sh workflow job targets this tier;
    # see the fan-out note in the memory budget above before lowering it.
    replicas: 5
    shutdown_on_exit: true
    runner:
      name: fireactions-small
      image: "{{ fireactions_runner_image }}"
      image_pull_policy: IfNotPresent
      # `| int` matters: Fireactions unmarshals group_id into an int64 and
      # yaml.v3 will not coerce a quoted string.
      group_id: "{{ fireactions_github_runner_group_id | int }}"
      organization: "{{ fireactions_github_organization }}"
      labels:
        - self-hosted
        - fireactions
        - fireactions-small
        - fireactions-2vcpu-4gb
    firecracker:
      binary_path: firecracker
      kernel_image_path: "{{ fireactions_kernel_image_path }}"
      kernel_args: "{{ fireactions_kernel_args }}"
      machine_config:
        mem_size_mib: 4096
        vcpu_count: 2
      metadata:
        pool: fireactions-small
        node: "{{ inventory_hostname }}"
        environment: homelab

  - name: fireactions-medium
    replicas: 1
    shutdown_on_exit: true
    runner:
      name: fireactions-medium
      image: "{{ fireactions_runner_image }}"
      image_pull_policy: IfNotPresent
      group_id: "{{ fireactions_github_runner_group_id | int }}"
      organization: "{{ fireactions_github_organization }}"
      labels:
        - self-hosted
        - fireactions
        - fireactions-medium
        - fireactions-4vcpu-8gb
    firecracker:
      binary_path: firecracker
      kernel_image_path: "{{ fireactions_kernel_image_path }}"
      kernel_args: "{{ fireactions_kernel_args }}"
      machine_config:
        mem_size_mib: 8192
        vcpu_count: 4
      metadata:
        pool: fireactions-medium
        node: "{{ inventory_hostname }}"
        environment: homelab

  - name: fireactions-large
    replicas: 1
    shutdown_on_exit: true
    runner:
      name: fireactions-large
      image: "{{ fireactions_runner_image }}"
      image_pull_policy: IfNotPresent
      group_id: "{{ fireactions_github_runner_group_id | int }}"
      organization: "{{ fireactions_github_organization }}"
      labels:
        - self-hosted
        - fireactions
        - fireactions-large
        - fireactions-8vcpu-12gb
    firecracker:
      binary_path: firecracker
      kernel_image_path: "{{ fireactions_kernel_image_path }}"
      kernel_args: "{{ fireactions_kernel_args }}"
      machine_config:
        mem_size_mib: 12288
        vcpu_count: 8
      metadata:
        pool: fireactions-large
        node: "{{ inventory_hostname }}"
        environment: homelab
