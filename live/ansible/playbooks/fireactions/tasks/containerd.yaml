---
# ============================================
# Containerd with the devmapper snapshotter
# ============================================
# Fireactions does not run containers. It uses Containerd purely to pull runner
# images and to hand each microVM a thin-provisioned copy of the image as its
# root block device - which is why the devmapper snapshotter (and therefore an
# LVM thin pool on a dedicated device) is mandatory.
# ============================================

- name: Check the installed Containerd version
  ansible.builtin.command:
    cmd: "{{ fireactions_bin_dir }}/containerd --version"
  register: fireactions_containerd_installed
  changed_when: false
  failed_when: false
  tags:
    - containerd

- name: Install Containerd
  when: "'v' ~ containerd_version not in (fireactions_containerd_installed.stdout | default(''))"
  tags:
    - containerd
  block:
    - name: Create a temporary directory for the Containerd download
      ansible.builtin.tempfile:
        state: directory
        suffix: containerd
      register: fireactions_containerd_tmp

    - name: Download the Containerd release archive
      ansible.builtin.get_url:
        url: >-
          https://github.com/containerd/containerd/releases/download/v{{ containerd_version }}/containerd-{{ containerd_version }}-linux-{{ fireactions_arch }}.tar.gz
        dest: "{{ fireactions_containerd_tmp.path }}/containerd.tar.gz"
        mode: "0600"

    - name: Unpack the Containerd release archive
      ansible.builtin.unarchive:
        src: "{{ fireactions_containerd_tmp.path }}/containerd.tar.gz"
        dest: "{{ fireactions_containerd_tmp.path }}"
        remote_src: true

    - name: Install the Containerd binaries
      ansible.builtin.copy:
        src: "{{ fireactions_containerd_tmp.path }}/bin/{{ item }}"
        dest: "{{ fireactions_bin_dir }}/{{ item }}"
        mode: "0755"
        owner: root
        group: root
        remote_src: true
      loop:
        - containerd
        - ctr
      notify: Restart containerd

  always:
    - name: Remove the temporary Containerd directory
      ansible.builtin.file:
        path: "{{ fireactions_containerd_tmp.path }}"
        state: absent
      when: fireactions_containerd_tmp.path is defined

- name: Install the Containerd systemd unit
  ansible.builtin.template:
    src: containerd.service.j2
    dest: /etc/systemd/system/containerd.service
    mode: "0644"
    owner: root
    group: root
  notify: Restart containerd
  tags:
    - containerd

# --------------------------------------------
# LVM thin pool
# --------------------------------------------
- name: Ensure the LVM profile directory exists
  ansible.builtin.file:
    path: /etc/lvm/profile
    state: directory
    mode: "0755"
    owner: root
    group: root
  tags:
    - containerd

- name: Install the Containerd LVM thin pool profile
  ansible.builtin.template:
    src: containerd-lvm.profile.j2
    dest: /etc/lvm/profile/{{ fireactions_containerd_volume_group }}.profile
    mode: "0644"
    owner: root
    group: root
  tags:
    - containerd

# Both of these notify the restart even though the config file has not
# changed. Containerd opens the devmapper pool once, at startup, and keeps the
# handle - so a pool that is recreated underneath a running daemon leaves the
# snapshotter permanently in error and `ctr plugins ls` reports devmapper as
# failed. That is not hypothetical: it is exactly what happens when the backing
# disk is resized, since the disk comes back empty and the pool is rebuilt from
# scratch while containerd is up.
- name: Create the Containerd volume group
  community.general.lvg:
    vg: "{{ fireactions_containerd_volume_group }}"
    pvs: "{{ fireactions_containerd_device }}"
    state: present
  notify:
    - Restart containerd
  tags:
    - containerd

- name: Create the Containerd thin pool
  community.general.lvol:
    vg: "{{ fireactions_containerd_volume_group }}"
    thinpool: "{{ fireactions_containerd_thinpool_name }}"
    size: "{{ fireactions_containerd_thinpool_size }}"
    opts: >-
      --poolmetadatasize {{ fireactions_containerd_thinpool_metadata_size }}
      --profile {{ fireactions_containerd_volume_group }}
      --monitor y
    state: present
  register: fireactions_containerd_thinpool
  notify:
    - Restart containerd
  tags:
    - containerd

# A restart alone is not enough after the pool is rebuilt. Containerd's
# snapshotter metadata lives on the ROOT disk, in /var/lib/containerd, and it
# survives the pool being wiped - so the daemon comes back believing in
# snapshots whose thin devices no longer exist, and every microVM creation
# fails with:
#
#   prepare: failed to create snapshot "containerd-thinpool-snap-960" (dev: 897)
#     from "containerd-thinpool-snap-13" (dev: 13): no data available: unknown
#
# The two stores have to be discarded together. This costs only the cached
# image layers, which re-pull from Harbor on the next pool refill.
#
# Guarded on the pool having actually been created, so a normal run never
# touches it - `state: present` reports changed only when the LV did not exist.
#
# These are deliberately NOT handlers (hence the noqa). Handlers are flushed
# after the remaining tasks, and this has to happen BEFORE "Enable and start
# Containerd" further down - the daemon must be down while its state directory
# is removed, and back up before the devmapper assertion runs.
- name: Stop Containerd before discarding its stale state # noqa: no-handler
  ansible.builtin.systemd_service:
    name: containerd
    state: stopped
  when: fireactions_containerd_thinpool.changed
  tags:
    - containerd

- name: Discard Containerd state left over from the previous thin pool # noqa: no-handler
  ansible.builtin.file:
    path: /var/lib/containerd
    state: absent
  when: fireactions_containerd_thinpool.changed
  tags:
    - containerd

# --------------------------------------------
# Configuration
# --------------------------------------------
- name: Create the Containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"
    owner: root
    group: root
  tags:
    - containerd

- name: Create the devmapper snapshotter root directory
  ansible.builtin.file:
    path: /var/lib/containerd/devmapper
    state: directory
    mode: "0711"
    owner: root
    group: root
  tags:
    - containerd

- name: Install the Containerd configuration
  ansible.builtin.template:
    src: containerd-config.toml.j2
    dest: /etc/containerd/config.toml
    mode: "0644"
    owner: root
    group: root
  notify: Restart containerd
  tags:
    - containerd

- name: Enable and start Containerd
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started
    daemon_reload: true
  tags:
    - containerd

# Fireactions refuses to start without a working devmapper snapshotter, so make
# sure any pending Containerd restart happens now rather than at end of play.
- name: Apply pending Containerd restarts before installing Fireactions
  ansible.builtin.meta: flush_handlers
  tags:
    - containerd

- name: Verify the devmapper snapshotter is loaded
  ansible.builtin.command:
    cmd: "{{ fireactions_bin_dir }}/ctr --address {{ fireactions_containerd_address }} plugins ls"
  register: fireactions_containerd_plugins
  changed_when: false
  retries: 5
  delay: 3
  until: fireactions_containerd_plugins.rc == 0
  tags:
    - containerd

# The regex work happens here rather than in the assert below: backslash
# escapes (\s, \b) silently evaluate to false inside assert/when conditionals,
# even though they behave correctly in a template like this one.
- name: Extract the devmapper plugin status line
  ansible.builtin.set_fact:
    fireactions_devmapper_line: >-
      {{ fireactions_containerd_plugins.stdout_lines
         | select('search', 'io.containerd.snapshotter.v1')
         | select('search', 'devmapper')
         | first | default('') }}
  tags:
    - containerd

- name: Assert the devmapper snapshotter is healthy
  ansible.builtin.assert:
    that:
      - fireactions_devmapper_line | length > 0
      - fireactions_devmapper_line.split() | last == 'ok'
    fail_msg: >-
      The Containerd devmapper snapshotter did not load. Check
      `ctr plugins ls` and `journalctl -u containerd`; the usual cause is a
      pool_name mismatch - it must be '<volume group>-<thin pool>', currently
      '{{ fireactions_containerd_pool_name }}'.
  tags:
    - containerd
